<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07060f">
<!-- PWA: instalable desde Safari (iPhone) y Chrome (Android) -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Musete">
<title>Musete</title>
<!-- Tipografías: Tilt Neon (rótulos de neón), Lilita One (marcador), Nunito (interfaz), Rubik (tablas y cifras) -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Tilt+Neon&family=Nunito:wght@600;700;800;900&family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* ───────── Q4 · Neón de bar ─────────
   Cristal oscuro ahumado (vitrina de bar de noche) y los colores de las pegatinas convertidos en luz:
   los bordes gordos pasan a ser tubos de neón (borde + resplandor), la sombra dura queda como reflejo
   desplazado y los números del marcador brillan como un letrero. Todo cuelga de las variables que pisa paint(). */
:root{
  --bg:#e9e6f5;--surface:#ffffff;--surface2:#ddd5f3;--line:#1d1736;
  --text:#1d1736;--muted:#554f75;--accent:#d11a80;--on-accent:#ffffff;
  --a:#d11a80;--a-soft:rgba(209,26,128,.18);--b:#08729e;--b-soft:rgba(8,114,158,.18);
  --danger:#c8202a;--ok:#0a8a4c;--warn:#f2a900;--shadow:4px 4px 0 color-mix(in srgb,var(--line) 16%,transparent);
  --ui:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Lilita One",Nunito,system-ui,sans-serif;
  --sign:"Tilt Neon","Lilita One",Nunito,system-ui,sans-serif; /* rótulo de neón: logo y títulos */
  --num:Rubik,Nunito,system-ui,sans-serif;
  --pop:cubic-bezier(.34,1.56,.64,1);
  --ink-soft:color-mix(in srgb,var(--line) 22%,transparent); /* separadores de listas */
  /* luz: en claro los neones se contienen (tubo oscurecido, brillo corto); en oscuro brillan a tope */
  --ga:72%;--gsh:90%;--tm:74%;--core:0%;--gl:36%;--gi:10%;--gr:5px;--gs:10%;--rf:30%;--gt:34%;--gt2:0%;--sf:10%;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#07060f;--surface:#15122a;--surface2:#262046;--line:#e6e0ff;
  --text:#f3efff;--muted:#a9a2cc;--accent:#ff4fa3;--on-accent:#0b0714;
  --a:#ff4fa3;--a-soft:rgba(255,79,163,.2);--b:#27dcff;--b-soft:rgba(39,220,255,.18);
  --danger:#ff6b6f;--ok:#3dff8f;--warn:#ffb81f;--shadow:4px 4px 0 color-mix(in srgb,var(--line) 12%,transparent);
  --ga:58%;--gsh:84%;--tm:100%;--core:38%;--gl:78%;--gi:20%;--gr:10px;--gs:20%;--rf:34%;--gt:80%;--gt2:40%;--sf:15%;
}}
:root[data-theme=dark]{
  --bg:#07060f;--surface:#15122a;--surface2:#262046;--line:#e6e0ff;
  --text:#f3efff;--muted:#a9a2cc;--accent:#ff4fa3;--on-accent:#0b0714;
  --a:#ff4fa3;--a-soft:rgba(255,79,163,.2);--b:#27dcff;--b-soft:rgba(39,220,255,.18);
  --danger:#ff6b6f;--ok:#3dff8f;--warn:#ffb81f;--shadow:4px 4px 0 color-mix(in srgb,var(--line) 12%,transparent);
  --ga:58%;--gsh:84%;--tm:100%;--core:38%;--gl:78%;--gi:20%;--gr:10px;--gs:20%;--rf:34%;--gt:80%;--gt2:40%;--sf:15%;
}
/* sin backdrop-filter: cristal casi opaco (se lee igual con cualquier color pintado) */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  :root:root:root{--ga:94%;--gsh:97%}
}
/* cada elemento calcula su propio tubo: --c (color de equipo/elemento) o, si no hay, la tinta neutra */
*{--tc:var(--c,var(--line));
  --tube:color-mix(in srgb,var(--tc) var(--tm),var(--line));
  --hot:color-mix(in srgb,#fff var(--core),var(--tube));
  --glow:0 0 var(--gr) color-mix(in srgb,var(--tube) var(--gl),transparent),inset 0 0 calc(var(--gr)*.7) color-mix(in srgb,var(--tube) var(--gi),transparent);
  --glow-s:0 0 8px color-mix(in srgb,var(--tube) var(--gs),transparent);
  --refl:3px 3px 0 color-mix(in srgb,var(--tube) var(--rf),transparent);
  --refl-s:2px 2px 0 color-mix(in srgb,var(--tube) var(--rf),transparent);
  --refl-m:4px 4px 0 color-mix(in srgb,var(--tube) var(--rf),transparent);
  --refl-l:6px 6px 0 color-mix(in srgb,var(--tube) var(--rf),transparent);
  --tx:0 0 6px color-mix(in srgb,var(--tube) var(--gt),transparent),0 0 16px color-mix(in srgb,var(--tube) var(--gt2),transparent)}
:root{--glass:color-mix(in srgb,var(--surface) var(--ga),transparent);--glass2:color-mix(in srgb,var(--surface2) var(--ga),transparent)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
/* fondo de puntitos tipo cuaderno */
body{background:var(--bg);background-image:radial-gradient(var(--ink-soft) 1.4px,transparent 1.6px);background-size:20px 20px;
  color:var(--text);font:700 16px/1.4 var(--ui);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible{outline:3px dashed var(--text);outline-offset:3px}
input{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
svg{display:block}
/* La partida es siempre horizontal: si la pantalla está de pie, se gira la interfaz 90°.
   Inicio, liga y ajustes siguen la orientación del móvil. */
:root{--W:100vw;--H:100dvh}
#root{position:fixed;top:0;left:0;width:var(--W);height:var(--H);overflow:hidden}
@media (orientation:portrait){
  :root[data-v=mus]{--W:100dvh;--H:100vw}
  :root[data-v=mus] #root{transform-origin:top left;transform:rotate(90deg) translateY(-100%)}
}
#app{max-width:1100px;margin:0 auto;height:100%;overflow-y:auto;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) max(14px,env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}

/* barra superior: botones cuadrados tipo pegatina */
.bar{display:flex;align-items:center;gap:10px;height:64px;flex:none;position:relative}
.bar h1{flex:1;margin:0;font:400 28px var(--display);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform:rotate(-1.5deg)}
.ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.ic:active{background:var(--surface2)}
.ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.ic.spin svg{animation:spin 1s linear infinite}
.bar .ic,.undoB{border:3px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:3px 3px 0 var(--line);
  transition:transform .12s var(--pop),box-shadow .12s}
.bar .ic:active,.undoB:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--line);background:var(--surface)}

/* botones: gordos, con sombra dura; al pulsar se hunden */
.btn{min-height:52px;padding:0 18px;border-radius:16px;background:var(--surface);font-weight:900;font-size:16px;
  border:3px solid var(--line);box-shadow:4px 4px 0 var(--line);
  display:inline-grid;place-items:center;transition:transform .12s var(--pop),box-shadow .12s}
.btn:active:not(:disabled){transform:translate(4px,4px);box-shadow:0 0 0 var(--line)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--surface)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.row{display:flex;gap:12px}.row>*{flex:1}

/* inicio */
.brushb svg{width:24px;height:24px;stroke-width:2.4}
.ptitle{font:400 18px/1.1 var(--display);margin:14px 0 8px;display:flex;align-items:baseline;gap:8px}.ptitle small{font:700 12px var(--ui);color:var(--muted)}
.paints{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:6px}
.paint{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:16px;background:var(--surface);border:3px solid var(--line);box-shadow:3px 3px 0 var(--line);cursor:pointer;min-height:56px}
.paint:active{transform:translate(3px,3px);box-shadow:none}
.paint input{flex:none;width:38px;height:38px;padding:0;border:3px solid var(--line);border-radius:50%;background:none;cursor:pointer;overflow:hidden}
.paint input::-webkit-color-swatch-wrapper{padding:0}.paint input::-webkit-color-swatch{border:0;border-radius:50%}
.paint input::-moz-color-swatch{border:0;border-radius:50%}
.paint span{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}.paint b{font-weight:800;font-size:14px}
.paint small{font-size:11px;color:var(--muted)}
.paint.set{background:var(--surface2)}
.paint .rs{width:32px;height:32px;flex:none;font-size:18px}
.cdot{width:24px;height:24px;border-radius:50%;background:var(--accent);border:3px solid var(--line)}
.hint{color:var(--muted);font-size:14px;margin:-4px 0 14px;font-weight:700}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:6px 0 16px}
.swatch{aspect-ratio:1;border-radius:16px;max-width:60px;width:100%;justify-self:center;border:3px solid var(--line);box-shadow:3px 3px 0 var(--line);
  display:grid;place-items:center;color:#14110f;font:900 24px var(--ui);transition:transform .18s var(--pop)}
.swatch:active{transform:translate(3px,3px);box-shadow:none}
.swatch.on{transform:rotate(-8deg) scale(1.14)}.swatch.on::after{content:"✓"}
.picker{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:16px;background:var(--surface);border:3px solid var(--line);box-shadow:4px 4px 0 var(--line);cursor:pointer}
.picker input{width:48px;height:40px;border:0;padding:0;background:none;border-radius:8px;cursor:pointer}
.picker span{font-weight:800}
.hero{padding:12px 4px 20px}
.hero .logo{display:inline-block;font:400 clamp(56px,17vw,84px)/1 var(--display);letter-spacing:.01em;color:var(--accent);
  -webkit-text-stroke:3px var(--line);paint-order:stroke fill;text-shadow:5px 5px 0 var(--line);transform:rotate(-2.5deg);animation:pop .7s var(--pop)}
.hero .logo i{color:var(--b);font-style:normal}
.hero p{display:inline-block;margin:14px 0 0 6px;padding:4px 12px;background:var(--surface);border:3px solid var(--line);border-radius:12px;
  box-shadow:3px 3px 0 var(--line);color:var(--text);font-weight:800;font-size:14px;transform:rotate(1.2deg)}
.game{background:var(--surface);border:3px solid var(--line);border-radius:22px;padding:16px;margin-bottom:18px;box-shadow:var(--shadow)}
.game:nth-of-type(1){background:var(--a)}.game:nth-of-type(2){background:var(--b)}
.game h2{margin:0;font:400 32px var(--display);color:var(--on-accent);letter-spacing:.01em}
.game p{margin:2px 0 14px;color:var(--on-accent);font-size:14px;font-weight:800}
.game .saved{display:inline-block;font-size:14px;font-weight:900;color:var(--text);background:var(--surface);border:2.5px solid var(--line);border-radius:10px;
  padding:3px 10px;margin:-6px 0 14px;transform:rotate(-1deg)}
.game .btn.primary{background:var(--text);color:var(--bg)}
.game .field span{color:var(--on-accent)}

/* mus: sin tarjetas, todo grande y tocable */
.mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:12px;white-space:nowrap}
.mid h1{flex:none;font:400 28px var(--display);transform:rotate(-3deg)}
.tally{display:flex;align-items:baseline;gap:6px;padding:1px 14px;border-radius:99px;border:3px solid var(--line);background:var(--surface);
  box-shadow:3px 3px 0 var(--line);font-variant-numeric:tabular-nums}
.tally small{font:900 10px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.tally b{font:800 20px var(--num)}
.tally i{font-style:normal;color:var(--muted);font-weight:900}
/* equipo: nombre-pegatina, jugadas, y [−] marcador [+] en una sola fila para ganar altura */
.team{--c:var(--a);display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"nm nm nm" "bn bn bn" "mi sc pl";
  align-content:center;justify-items:center;align-items:center;gap:8px 8px;min-width:0;min-height:0}
.team.t1{--c:var(--b)}
.tname{grid-area:nm;display:flex;align-items:center;gap:8px;max-width:100%;min-width:0;padding:2px 5px 2px 12px;border-radius:12px;
  background:var(--c);color:var(--on-accent);border:3px solid var(--line);box-shadow:3px 3px 0 var(--line);
  font:400 clamp(18px,calc(var(--H)*.062),26px)/1.2 var(--display)}
.tname .tn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tname .ses{flex:none;min-width:30px;height:30px;padding:0 4px;border-radius:99px;background:var(--surface);color:var(--text);border:2.5px solid var(--line);
  display:grid;place-items:center;font:800 16px var(--num)}
.bon{grid-area:bn;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:100%}
.bon button{height:38px;padding:0 12px;border-radius:12px;font-size:14px;font-weight:900;background:var(--surface);
  border:2.5px solid var(--line);box-shadow:2px 2px 0 var(--line);transition:transform .1s var(--pop),box-shadow .1s}
.bon button:active{transform:translate(2px,2px);box-shadow:none;background:var(--c)}
.bon .brk{flex-basis:100%;height:0}
button.score{grid-area:sc;width:100%;max-width:210px;background:var(--c);color:var(--on-accent);border:4px solid var(--line);border-radius:22px;
  box-shadow:6px 6px 0 var(--line);font:400 clamp(60px,calc(var(--H)*.24),140px)/1.04 var(--display);font-variant-numeric:tabular-nums;padding:0 .1em;
  transition:transform .12s var(--pop),box-shadow .12s}
button.score:active{transform:translate(6px,6px);box-shadow:0 0 0 var(--line)}
.pm{display:contents}
.pm button{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:3px solid var(--line);
  box-shadow:3px 3px 0 var(--line);transition:transform .12s var(--pop),box-shadow .12s}
.pm button:active:not(:disabled){transform:translate(3px,3px);box-shadow:none}
.pm .minus{grid-area:mi}.pm .plus{grid-area:pl;background:var(--c);color:var(--on-accent)}
.pm button:disabled{box-shadow:none}
.pm svg,.env svg{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.pm svg{width:32px;height:32px;stroke-width:3.4}
/* envites: ← − [lance nº] + → */
.envs{display:flex;flex-direction:column;justify-content:center;gap:6px;min-height:0}
.env{flex:1;max-height:70px;min-height:50px;display:flex;align-items:center;justify-content:center;gap:clamp(3px,calc(var(--W)*.008),8px)}
.env .s{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--surface);border:3px solid var(--line);
  box-shadow:2px 2px 0 var(--line);transition:transform .1s var(--pop),box-shadow .1s}
.env .s:active:not(:disabled){transform:translate(2px,2px);box-shadow:none}
.env .s svg{width:24px;height:24px;stroke-width:3.4}
.env .s.plus{background:var(--warn);color:#14110f}
.env .s:disabled,.give:disabled{box-shadow:none}
.give{width:44px;height:44px;border-radius:50%;background:var(--surface);color:var(--on-accent);border:3px solid var(--line);box-shadow:2px 2px 0 var(--line);
  display:grid;place-items:center;flex:none;transition:transform .1s var(--pop),box-shadow .1s}
.give.t0{background:var(--a)}.give.t1{background:var(--b)}
.give:disabled{background:var(--surface);color:var(--muted)}
.give:active:not(:disabled){transform:translate(2px,2px);box-shadow:none}
.give svg{width:22px;height:22px;stroke-width:3.2}
.env .num{min-width:66px;height:54px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
  background:var(--surface);border:3px solid var(--line);box-shadow:3px 3px 0 var(--line);font-variant-numeric:tabular-nums;
  transition:transform .12s var(--pop),box-shadow .12s}
.env .num small{font:900 9.5px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.env .num b{font:400 28px/1 var(--display)}
.env .num:active{transform:translate(3px,3px);box-shadow:none}
.pill{min-height:50px;padding:0 26px;border-radius:99px;border:3px solid var(--line);background:var(--surface);box-shadow:4px 4px 0 var(--line);font-weight:900;
  transition:transform .12s var(--pop),box-shadow .12s}
.pill:active{transform:translate(4px,4px);box-shadow:none}
.ordago{background:var(--warn);color:#14110f;font:400 20px var(--display);letter-spacing:.02em}
.histB{color:var(--text)}
.undoB{width:52px;height:52px}.undoB svg{width:26px;height:26px}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) 52px 60px;gap:8px;align-items:center;min-height:46px;border-top:2px dashed var(--ink-soft);font-variant-numeric:tabular-nums}
.hrow .hw{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .hd{color:var(--muted);font-size:14px}
.hrow b{justify-self:end;background:var(--accent);color:var(--on-accent);border:2px solid var(--line);border-radius:8px;padding:0 8px;font:800 15px var(--num)}
.hrow .hs{text-align:right;color:var(--muted);font:700 13px var(--num)}
/* modo mesa: 'swp' cambia de lado las parejas (solo dibujo) */
.v-mus .team.t0.swp{grid-column:3}.v-mus .team.t1.swp{grid-column:1}
.olab{display:block;font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
.ochips,.orow{display:grid;gap:8px}.ochips{grid-template-columns:repeat(4,1fr)}.orow{grid-template-columns:repeat(3,1fr)}
.ol{padding:0 4px}.ol.on{background:var(--warn);color:#14110f}
.orow .btn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px;display:block}

/* liga */
.card{background:var(--surface);border:3px solid var(--line);border-radius:22px;padding:14px 16px;margin-bottom:18px;box-shadow:var(--shadow)}
.card h3{display:block;width:fit-content;margin:-28px 0 10px -6px;padding:2px 14px;background:var(--accent);color:var(--on-accent);border:3px solid var(--line);
  border-radius:12px;box-shadow:3px 3px 0 var(--line);font:400 20px var(--display);letter-spacing:.02em;transform:rotate(-2deg)}
.card:nth-of-type(even) h3{background:var(--b);transform:rotate(1.5deg)}
.card.lg h3{margin:0}
.lg h2{margin:0;font:400 30px var(--display)}
.status{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--muted);margin-top:2px}
.status i{width:12px;height:12px;border-radius:50%;background:var(--ok);border:2.5px solid var(--line)}
.status.off i{background:var(--danger)}
.codebox{display:flex;align-items:center;gap:10px;margin-top:12px;padding:8px 8px 8px 14px;border-radius:14px;background:var(--bg);border:3px dashed var(--line)}
.codebox div{flex:1;min-width:0}
.codebox small{display:block;font-size:12px;color:var(--muted)}
.codebox b{font:700 22px ui-monospace,Consolas,monospace;letter-spacing:.14em;-webkit-user-select:text;user-select:text}
.tr{display:grid;grid-template-columns:28px 1fr 32px 32px 32px 48px;gap:4px;align-items:center;min-height:48px;width:100%;
  text-align:right;font:700 15px var(--num);font-variant-numeric:tabular-nums;border-top:2px dashed var(--ink-soft)}
.tr.th{min-height:28px;font:900 11px var(--ui);letter-spacing:.06em;color:var(--muted);border-top:0}
.tr .pos{text-align:left;color:var(--muted);font-weight:800}
.tr.th+.pl .pos{width:24px;height:24px;border-radius:50%;background:var(--warn);color:#14110f;border:2.5px solid var(--line);display:grid;place-items:center;font-size:13px}
.tr .nm{text-align:left;font:900 16px var(--ui);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .nm small{display:block;font-weight:700;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.tr .g{justify-self:end;min-width:26px;text-align:center;padding:0 5px;border-radius:8px;background:var(--accent);color:var(--on-accent);border:2px solid var(--line);font-weight:800}
.match{display:flex;align-items:center;gap:8px;min-height:52px;border-top:2px dashed var(--ink-soft)}
.match .d{width:48px;flex:none;font:900 11px var(--ui);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.match .mt{flex:1;min-width:0;font:700 14px var(--num);font-variant-numeric:tabular-nums}
.match .mt small{display:block;font:900 12px var(--ui);color:var(--danger)}
.match b{font-weight:700}.match b.w{font-weight:800;background:linear-gradient(transparent 52%,var(--accent) 52%)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{min-height:44px;padding:0 16px;border-radius:99px;font-weight:900;border:3px solid var(--line);background:var(--surface);box-shadow:3px 3px 0 var(--line)}
.chip.t0{background:var(--a);color:var(--on-accent)}.chip.t1{background:var(--b);color:var(--on-accent)}
.pairname{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 6px 8px 14px;border-radius:14px;margin-bottom:8px;background:var(--a-soft);border:3px solid var(--line);--c:var(--a)}
.pairname.t1{background:var(--b-soft);--c:var(--b)}
.pairname b{font:400 22px var(--display)}
.pairname small{display:block;font-size:13px;color:var(--muted)}
.tcard{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:76px;padding:10px 6px 10px 14px;border-radius:14px;
  margin-bottom:8px;background:var(--soft);border:3px solid var(--line);box-shadow:3px 3px 0 var(--line);cursor:pointer}
.tcard.t0{--c:var(--a);--soft:var(--a-soft)}.tcard.t1{--c:var(--b);--soft:var(--b-soft)}
.tcard>div{min-width:0}
.tcard small{display:block;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.tcard b{display:block;font:400 22px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard b.empty{font:800 17px var(--ui)}
.tcard span:not(.ic){display:block;font-size:13px;color:var(--muted)}
.tcard:active{transform:translate(3px,3px);box-shadow:none}
/* nueva partida: dos huecos de pareja */
.slots{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0 12px}
.slot{display:flex;align-items:center;gap:2px;min-height:64px;padding:6px 4px 6px 12px;border-radius:16px;background:var(--soft);border:3px solid var(--line);
  min-width:0;transition:transform .2s var(--pop),box-shadow .2s}
.slot.t0{--c:var(--a);--soft:var(--a-soft)}.slot.t1{--c:var(--b);--soft:var(--b-soft)}
.slot.act{background:var(--c);color:var(--on-accent);box-shadow:4px 4px 0 var(--line);transform:translate(-2px,-2px) rotate(-1deg)}
.slot.act span,.slot.act small{color:var(--on-accent)}
.slot>div{flex:1;min-width:0}
.slot small{display:block;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.slot b{display:block;font:400 21px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot b.empty{font:800 16px var(--ui);color:var(--muted)}
.slot.act b.empty{color:var(--on-accent)}
.slot span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .ic{width:40px;height:40px}
.quick{display:flex;gap:8px;overflow-x:auto;padding:2px 4px 10px 2px;margin-bottom:4px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.qp{flex:none;min-height:44px;padding:0 14px;border-radius:99px;font-size:14px;font-weight:800;color:var(--text);white-space:nowrap;
  border:2.5px solid var(--line);background:var(--surface);box-shadow:2px 2px 0 var(--line);transition:transform .1s var(--pop),box-shadow .1s}
.qp:active{transform:translate(2px,2px);box-shadow:none}
.search{width:100%;height:46px;border-radius:14px;border:3px solid var(--line);background:var(--surface);padding:0 14px;margin-bottom:10px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px}
.pc{height:46px;padding:0 8px;border-radius:12px;background:var(--surface);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  border:3px solid var(--line);box-shadow:2px 2px 0 var(--line);transition:transform .15s var(--pop),box-shadow .1s}
.pc:active{transform:translate(2px,2px);box-shadow:none}
.pc.t0{background:var(--a);color:var(--on-accent)}.pc.t1{background:var(--b);color:var(--on-accent)}
.pc.t0,.pc.t1{transform:rotate(-2deg) scale(1.03)}
.pc i{font-style:normal;font-size:12px;margin-left:6px;font-weight:900}
.sheet.wide{max-width:760px}
.ogrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ocol{display:flex;flex-direction:column;gap:8px;min-width:0;--c:var(--a)}.ocol.t1{--c:var(--b)}
.ocol small{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.ocol .btn{width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.owin{background:var(--surface);color:var(--text)}
.owin.on,.oby.on{background:var(--c);color:var(--on-accent)}
.oby{min-height:46px}
.og{font-style:normal;font-size:12px;color:var(--muted);margin-left:6px}
.plist{margin:0 -4px;--c:var(--a)}.plist.t1{--c:var(--b)}
.prow{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:54px;padding:0 10px;border-top:2px dashed var(--ink-soft);font-weight:900;text-align:left}
.prow i{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:15px;color:var(--on-accent)}
.prow.on i{background:var(--c)}.prow.on i::after{content:"✓"}
.hint,.sheet p.hint{color:var(--muted);font-size:14px;margin:8px 0}
.pl{cursor:pointer}.pl:active{background:var(--surface2)}
.fm{display:inline-flex;gap:3px;align-items:center;vertical-align:middle;margin-right:6px}
.dot{width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid var(--line);display:inline-block}
.dot.l{background:var(--danger)}
.sk{font-weight:900;font-size:12px;color:var(--text);background:var(--ok);color:#14110f;border:2px solid var(--line);border-radius:8px;padding:0 6px}
.sk.l{background:var(--danger);color:#fff}
.rec{font-size:13px;color:var(--muted);margin:10px 0 0;font-weight:700}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-top:2px dashed var(--ink-soft);font-size:15px}
.kv span{color:var(--muted);flex:none}.kv b{font-weight:900;text-align:right;min-width:0}
.aw{padding:10px 0;border-top:2px dashed var(--ink-soft)}
.aw .ah{display:flex;justify-content:space-between;align-items:center;gap:8px}
.an{font:400 19px var(--display);text-align:left;min-height:40px}.an i{font-style:normal;color:var(--muted);font:800 13px var(--ui);margin-left:6px}
.aw .av{font:800 13px var(--num);white-space:nowrap;background:var(--warn);color:#14110f;border:2px solid var(--line);border-radius:99px;padding:1px 10px}
.aw .av:empty{display:none}
.aw .ar{font-size:12px;color:var(--muted)}.aw .ao{font-size:15px;font-weight:900;margin-top:2px}
.tg{display:inline-block;font-style:normal;font-size:11px;font-weight:900;padding:0 7px;border-radius:99px;border:2px solid var(--line);background:var(--warn);color:#14110f;margin-left:6px;white-space:nowrap;transform:rotate(-2deg)}
.match{cursor:pointer}
.more{margin-top:12px}
/* filtros de "Todas las partidas": fijos arriba junto a la barra */
/* #app deja arriba el hueco de la barra de estado (safe-area); la barra fija sube hasta el borde
   y rellena ese hueco con fondo, para que la lista no se vea por detrás de la hora y los iconos */
.fbar{--sat:env(safe-area-inset-top,0px);position:sticky;top:calc(-1*var(--sat));margin-top:calc(-1*var(--sat));padding-top:var(--sat);
  z-index:3;background:var(--bg);padding-bottom:10px;margin-bottom:8px}
.frow{display:flex;gap:10px;align-items:center}
.fbtn{flex:1;min-width:0;height:46px;padding:0 14px;border-radius:99px;font-size:15px;font-weight:900;color:var(--text);background:var(--surface);
  border:3px solid var(--line);box-shadow:3px 3px 0 var(--line);display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:transform .12s var(--pop),box-shadow .12s}
.fbtn:active{transform:translate(3px,3px);box-shadow:none}
.fbtn i{font-style:normal;font-size:12px;transition:transform .2s var(--pop)}
.fbtn.open i{transform:rotate(180deg)}
.fbtn.on{background:var(--accent);color:var(--on-accent)}
.fx{width:46px;height:46px;border:3px solid var(--line);border-radius:50%;background:var(--surface);box-shadow:3px 3px 0 var(--line)}
.fx:active{transform:translate(3px,3px);box-shadow:none}
.fpanel{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;padding:12px;border-radius:18px;background:var(--surface);border:3px solid var(--line);box-shadow:var(--shadow);max-height:42vh;overflow:auto;animation:drop .25s var(--pop)}
.fpanel small{width:100%;font-size:12px;font-weight:900;color:var(--muted);margin:2px 2px 0}
.qp.on{background:var(--accent);color:var(--on-accent)}
.mrec{margin:0 0 8px;font-size:14px;color:var(--muted)}.mrec b{color:var(--text)}
.ch{width:100%;height:auto;margin:6px 0}.ch .gr{stroke:var(--ink-soft);stroke-width:1;stroke-dasharray:3 3}.ch text{fill:var(--muted);font-size:9px;font-weight:700}
.ch .ca,.ch .cb{fill:none;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
.ch .ca{stroke:var(--a)}.ch .cb{stroke:var(--b)}.ch circle.ca{fill:var(--a);stroke:var(--line);stroke-width:2}.ch circle.cb{fill:var(--b);stroke:var(--line);stroke-width:2}
.lgd{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;font-weight:900}
.lgd .la,.lgd .lb{padding:1px 10px;border:2.5px solid var(--line);border-radius:99px;color:var(--on-accent)}
.lgd .la{background:var(--a)}.lgd .lb{background:var(--b)}
.fc{margin:12px 0 2px;padding:10px 12px;border-radius:16px;background:var(--surface2);border:3px solid var(--line);box-shadow:3px 3px 0 var(--line);font-size:13px}
.fc .fh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.fc .fh small{color:var(--muted);font-size:11px}
.fc .fp{display:flex;justify-content:space-between;font:400 26px var(--display);font-variant-numeric:tabular-nums;margin-top:2px}
.fc .fp .a,.fc .fp .b{padding:0 10px;border:2.5px solid var(--line);border-radius:10px;color:var(--on-accent)}
.fc .fp .a{background:var(--a)}.fc .fp .b{background:var(--b)}
.fc .fgb{height:14px;border-radius:99px;background:var(--b);border:2.5px solid var(--line);overflow:hidden;margin:6px 0 8px}.fc .fgb i{display:block;height:100%;background:var(--a);border-right:2.5px solid var(--line)}
.fc div.fl{color:var(--muted);margin-top:3px}.fc div.fl b{color:var(--text);font-weight:900}

/* ajustes */
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:3px solid var(--line);border-radius:18px;padding:12px 16px;margin-bottom:14px;
  min-height:68px;width:100%;text-align:left;font-weight:900;box-shadow:4px 4px 0 var(--line);transition:transform .12s var(--pop),box-shadow .12s}
button.set:active{transform:translate(4px,4px);box-shadow:none}
.set small{display:block;color:var(--muted);font-size:13px;font-weight:700}
.sw{width:58px;height:34px;border-radius:99px;background:var(--surface2);border:3px solid var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);border:3px solid var(--line);transition:transform .25s var(--pop)}
.sw.on{background:var(--ok)}.sw.on::after{transform:translateX(24px)}
.seg{display:flex;background:var(--surface);border:3px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;min-height:42px;padding:0 12px;border-radius:10px;font-weight:900;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--on-accent);box-shadow:inset 0 0 0 2.5px var(--line)}
.note{color:var(--muted);font-size:13px;text-align:center;margin-top:18px;font-weight:800}

/* hojas / diálogos */
.overlay{position:absolute;inset:0;background:rgba(20,17,15,.62);display:flex;align-items:flex-end;justify-content:center;z-index:10;animation:fade .15s}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:calc(var(--H)*.96);overflow:auto;border:3px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;
  padding:22px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:inset 0 9px 0 var(--accent);animation:up .4s var(--pop)}
.sheet h2{margin:0 0 4px;font:400 28px var(--display);letter-spacing:.01em}
.sheet p{margin:0 0 14px;color:var(--muted)}
.sheet .row{margin-top:16px}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;font-weight:900;color:var(--muted);margin-bottom:6px}
.field input,.pin input{width:100%;height:50px;border-radius:14px;border:3px solid var(--line);background:var(--surface);padding:0 14px;font-weight:800}
.field input:focus,.pin input:focus,.search:focus{outline:0;box-shadow:4px 4px 0 var(--accent)}
.pin{display:flex;gap:10px;margin-bottom:8px;align-items:center}
.pin input{flex:1;min-width:0}
.pin .btn{flex:none}
.line{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0}
.win{text-align:center;padding:10px 0 4px}
.win .big{font:400 40px/1.1 var(--display);margin:8px 0;-webkit-text-stroke:2.5px var(--line);paint-order:stroke fill;text-shadow:4px 4px 0 var(--line);animation:pop .7s var(--pop)}
.win .res{font:400 64px/1 var(--display);font-variant-numeric:tabular-nums;margin:10px 0 4px}
.win .res span{-webkit-text-stroke:2.5px var(--line);paint-order:stroke fill;text-shadow:3px 3px 0 var(--line)}
.win .res span.t0{color:var(--a)}.win .res span.t1{color:var(--b)}
#toast{position:absolute;left:50%;top:calc(8px + env(safe-area-inset-top));transform:translate(-50%,-30px) rotate(-1deg);background:var(--warn);color:#14110f;
  border:3px solid var(--line);box-shadow:4px 4px 0 var(--line);padding:8px 18px;border-radius:99px;font-weight:900;font-size:14px;opacity:0;pointer-events:none;
  transition:transform .3s var(--pop),opacity .2s;z-index:20;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0) rotate(-1deg)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(60px);opacity:0}}
@keyframes drop{from{transform:translateY(-12px) scale(.97);opacity:0}}
@keyframes pop{0%{transform:scale(.6) rotate(-8deg);opacity:0}100%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* diseño horizontal (único) */
  #app.v-settings{max-width:560px}
  .bar{height:52px}
  /* mus: equipo 1 | envites | equipo 2; abajo deshacer | historial | órdago. Sin scroll */
  #app.v-mus{display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:auto minmax(0,1fr) auto;column-gap:10px;height:100%;min-height:0;
    padding-bottom:calc(12px + env(safe-area-inset-bottom));padding-right:max(16px,env(safe-area-inset-right));padding-left:max(10px,env(safe-area-inset-left))}
  .v-mus .bar{grid-column:1/-1;height:54px}
  .v-mus .teams{display:contents}
  .v-mus .team{grid-row:2}
  .v-mus .team.t0{grid-column:1}.v-mus .team.t1{grid-column:3}
  .v-mus .envs{grid-column:2;grid-row:2}
  .v-mus .undoB{grid-column:1;grid-row:3;justify-self:center}
  .v-mus .histB{grid-column:2;grid-row:3;justify-self:center}
  .v-mus .ordago{grid-column:3;grid-row:3;justify-self:center}
  /* móviles estrechos en horizontal: [−][+] pasan debajo del marcador */
  @media (max-width:720px){
    .team{grid-template-columns:1fr 1fr;grid-template-areas:"nm nm" "bn bn" "sc sc" "mi pl";gap:6px}
    .pm button{width:100%;height:44px}
    button.score{font-size:clamp(48px,calc(var(--H)*.19),96px)}
  }
  @media (orientation:landscape){
  /* inicio: tarjetas lado a lado */
  #app.v-home{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;align-content:start}
  .v-home .bar{grid-column:1/-1;margin-bottom:-52px}
  .v-home .hero{grid-column:1/-1;padding:6px 4px 14px}
  .v-home .hero .logo{font-size:56px}
  .v-home .game{margin:0 0 14px;display:flex;flex-direction:column}
  .v-home .game .row{margin-top:auto}
  /* liga: tablas en dos columnas */
  .v-liga .cols{columns:2;column-gap:18px}
  .v-liga .cols>*{break-inside:avoid}
  .v-liga .lg{display:flex;align-items:baseline;gap:12px;padding:8px 14px}
  .v-liga .lg .status{margin:0}
  }
  .sheet{padding-top:20px}
  .sheet p{margin-bottom:8px}
  .sheet .hrow:first-of-type{border-top:0}
  .tcard{min-height:58px;padding-top:5px;padding-bottom:5px}
  .sheet .row{margin-top:10px}

/* ═════════ Q4 · capa neón (cristal + tubos + reflejo duro) ═════════ */
/* fondo: noche con dos halos de color (equipo 1 arriba-izquierda, equipo 2 abajo-derecha) */
body{background:radial-gradient(80vmax 60vmax at 0% 0%,color-mix(in srgb,var(--a) 20%,transparent),transparent 70%),
  radial-gradient(70vmax 55vmax at 100% 100%,color-mix(in srgb,var(--b) 18%,transparent),transparent 70%),var(--bg)}
button:focus-visible,input:focus-visible{outline:2.5px solid var(--hot);outline-offset:3px;box-shadow:var(--glow)}
/* piezas de cristal que sí llevan desenfoque (pocas y grandes: el rendimiento manda) */
.card,.game,.sheet,.set,.fpanel,.fc{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.overlay{background:color-mix(in srgb,var(--bg) 70%,transparent);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.overlay{background:color-mix(in srgb,var(--bg) 86%,transparent)}}

/* barra: botones tubo cian, título de rótulo */
.bar h1{font-family:var(--sign);font-weight:400;--c:var(--accent);color:var(--hot);text-shadow:var(--tx)}
.bar .ic,.undoB{--c:var(--b);background:var(--glass2);border:2.5px solid var(--tube);color:var(--hot);box-shadow:var(--refl),var(--glow)}
.bar .ic:active,.undoB:active:not(:disabled){background:color-mix(in srgb,var(--tube) 22%,var(--glass2));box-shadow:var(--glow)}
.undoB:disabled{box-shadow:none;border-color:var(--ink-soft)}
.ic:active{background:color-mix(in srgb,var(--tube) 20%,transparent)}

/* botones */
.btn{background:var(--glass);border:2.5px solid var(--tube);box-shadow:var(--refl-m),var(--glow)}
.btn:active:not(:disabled){box-shadow:var(--glow)}
.btn.primary{--c:var(--accent);background:var(--accent);color:var(--on-accent);box-shadow:var(--refl-m),var(--glow),0 0 0 1px var(--accent)}
.btn.ghost{background:var(--glass)}
.btn.danger{--c:var(--danger);color:var(--danger)}
.btn:disabled{box-shadow:none;border-color:var(--ink-soft)}

/* inicio: pincel y pegatinas de color */
.paint{background:var(--glass);border:2.5px solid var(--tube);box-shadow:var(--refl),var(--glow-s)}
.paint:active{box-shadow:none}
.paint input{border:2.5px solid var(--tube);box-shadow:var(--glow-s)}
.paint.set{background:color-mix(in srgb,var(--tube) 16%,var(--glass))}
.cdot{border:2.5px solid var(--tube);box-shadow:var(--glow-s)}
.swatch{border:2.5px solid var(--tube);box-shadow:var(--refl)}
.swatch:active{box-shadow:none}
.swatch.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--hot),0 0 14px var(--hot)}
.picker{background:var(--glass);border:2.5px solid var(--tube);box-shadow:var(--refl-m),var(--glow-s)}
.hero .logo{font-family:var(--sign);font-weight:400;-webkit-text-stroke:0;--c:var(--accent);color:var(--hot);
  text-shadow:var(--tx),4px 4px 0 color-mix(in srgb,var(--tube) 30%,transparent);animation:pop .7s var(--pop),buzz 6s 1s infinite}

<body>
<div id="root"><div id="app"></div><div id="modal"></div><div id="toast" role="status"></div></div>
<script>
'use strict';
/* ───────── Servidor de la liga (Supabase) ─────────
   Clave pública: solo permite llamar a las funciones league_*; las tablas están cerradas con RLS. */
const SB_URL='https://newrdgvflijdwtrjpeqn.supabase.co';
const SB_KEY='sb_publishable_hQhT7tuba2e-DYUMIhbl3Q_VduFcF8p';
const ERR={LEAGUE_NOT_FOUND:'No existe ninguna liga con ese código',NAME_TAKEN:'Ya existe ese jugador',
  PLAYER_IN_USE:'Tiene partidas: no se puede quitar',bad_code:'Código de la liga incorrecto',BAD_NAME:'Nombre no válido',BAD_PLAYERS:'Jugadores no válidos',TOO_MANY_PLAYERS:'Demasiados jugadores'};
// quiet=true: un bad_code no expulsa a la pantalla de acceso (lo usa la propia validación del código)
async function rpc(fn,args,quiet){
  let r;
  try{r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(args)})}
  catch(e){const er=new Error('Sin conexión');er.net=true;throw er}
  const j=await r.json().catch(()=>null);
  if(!r.ok){
    if(String(j&&j.message||'').includes('bad_code')){ // código rotado o inválido
      const er=new Error(ERR.bad_code);er.code='bad_code';if(!quiet)lockOut('El código de la liga ha cambiado');throw er}
    const er=new Error(ERR[j&&j.message]||'Error del servidor');er.code=j&&j.message;throw er}
  return j;
}

/* ───────── Estado ───────── */
const KEY='musete.v1';
// El código de la liga es una contraseña que teclea el usuario: se guarda en S.code (localStorage) y nunca se muestra
const newLeague=()=>({name:'Liga Musete',players:[],matches:[],pending:[],dels:[],titles:{}});
const DEF={settings:{keepOn:true,theme:'auto',haptics:true},
  musDef:{t:[[],[]]},
  code:'',league:newLeague(),mus:null};
const ENV=['Grande','Chica','Pares','Juego'];
// Jugadas que se cobran con un toque: [nombre, puntos, lance al que cuentan]
const BON=[['Par',1,2],['Trío',2,2],['Duples',3,2],['31',3,3],['32+',2,3]];
let S=load(), modal=null, depth=0;
const undo={mus:[]};

function load(){
  const d=JSON.parse(JSON.stringify(DEF));
  try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');
    const o={settings:{...d.settings,...s.settings},musDef:{...d.musDef,...s.musDef},
      mus:s.mus&&s.mus.target===40&&s.mus.league?s.mus:null, // partidas de versiones anteriores se descartan
      code:typeof s.code==='string'?s.code:'',
      league:s.league?{...d.league,...s.league,dels:[]}:d.league}; // dels: los borrados ahora exigen PIN y ya no se encolan
    delete o.league.code; // versiones anteriores guardaban aquí el código fijo
    return o;
  }catch(e){return d}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function snap(g){undo[g].push(JSON.stringify(S[g]));if(undo[g].length>200)undo[g].shift()}
function commit(){save();render()}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const view=()=>{const v=location.hash.slice(1)||'home';return v==='mus'&&!S.mus?'home':v};
function go(v){if(location.hash.slice(1)===v){render();return}depth++;location.hash=v}
function back(){if(depth>0){depth--;history.back()}else{location.replace('#home')}}
function buzz(ms){if(S.settings.haptics&&navigator.vibrate)try{navigator.vibrate(ms||8)}catch(e){}}
let toastT;function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2200)}

/* ───────── Liga: sincronización ───────── */
const lgDraft={name:'',code:'',lp:'',lk:''};
let lockErr='',lockBusy=false,adminPin=null,trash=[]; // adminPin: solo en memoria, nunca se guarda
let syncing=false,again=false,offline=false,busy=false;
const pname=id=>(S.league.players.find(p=>p.id===id)||{name:'—'}).name;
function applyState(st){
  const L=S.league;
  L.name=st.name;L.players=st.players;L.titles=st.titles||{}; // nombres de los motes, compartidos
  L.matches=st.matches.map(m=>({...m,date:Date.parse(m.date)})).filter(m=>!L.dels.includes(m.uid));
  save();
}
// Sube lo pendiente (partidas apuntadas o borradas sin cobertura) y baja el estado de la liga
async function sync(){
  const L=S.league;if(!S.code)return;
  if(syncing){again=true;return}
  syncing=true;soft();
  try{
    while(L.pending.length){
      const m=L.pending[0];
      try{await rpc('league_match_add',{p_code:S.code,p_uid:m.uid,p_a1:m.a[0],p_a2:m.a[1],p_b1:m.b[0],p_b2:m.b[1],
        p_na:m.na,p_nb:m.nb,p_ja:m.ja,p_jb:m.jb,p_w:m.w,p_date:new Date(m.date).toISOString(),p_detail:m.d||null})}
      catch(e){if(e.net||e.code==='LEAGUE_NOT_FOUND'||e.code==='bad_code')throw e} // rechazada por el servidor: se descarta
      const i=L.pending.indexOf(m);if(i>=0)L.pending.splice(i,1);save();
    }
    const st=await rpc('league_state',{p_code:S.code});
    if(S.league===L){if(st)applyState(st);else throw Object.assign(new Error(ERR.LEAGUE_NOT_FOUND),{code:'LEAGUE_NOT_FOUND'})}
    offline=false;
  }catch(e){offline=!!e.net;if(!e.net&&e.code!=='bad_code')toast(e.message)}
  syncing=false;soft();
  if(again){again=false;sync()}
}
// Acción de red lanzada por el usuario (crear, unirse, jugadores)
async function net(fn,args,after){
  if(busy)return;busy=true;
  try{const st=await rpc(fn,args);if(st)applyState(st);offline=false;if(after)after(st)}
  catch(e){if(e.net)offline=true;if(e.code!=='bad_code')toast(e.message)}
  busy=false;render();
}
/* ───────── Acceso con código de la liga ───────── */
function lockOut(msg){S.code='';adminPin=null;trash=[];modal=null;lockErr=msg||'';save();render()}
async function enterLeague(){
  if(lockBusy)return;
  const c=String(lgDraft.lk||'').trim().toUpperCase();
  if(!c){lockErr='Escribe el código de la liga';render();return}
  lockBusy=true;lockErr='';render();
  try{
    const st=await rpc('league_state',{p_code:c},true);
    if(!st)throw Object.assign(new Error(ERR.bad_code),{code:'bad_code'});
    S.code=c;lgDraft.lk='';lockBusy=false;applyState(st);offline=false;save();render();sync();return;
  }catch(e){lockErr=e.net?'Sin conexión: no se puede comprobar el código':e.code==='bad_code'?'Código incorrecto':e.message}
  lockBusy=false;render();
}
// Acción de administrador (borrar partida, renombrar mote, papelera): pide PIN y llama al RPC con p_pin.
// El PIN solo se recuerda en memoria tras usarlo con éxito; bad_pin lo olvida y lo vuelve a pedir.
function adminDo(title,fn,args,onOk,err){
  const run=async pin=>{
    if(busy)return;busy=true;let r=null;
    try{r=await rpc(fn,{...args,p_code:S.code,p_pin:pin})}
    catch(e){busy=false;if(e.net)offline=true;if(e.code!=='bad_code')toast(e.message);render();return}
    busy=false;
    if(r&&r.ok){adminPin=pin;modal=null;render();onOk(r);return}
    adminPin=null;
    if(r&&r.error==='bad_pin'){adminDo(title,fn,args,onOk,'PIN incorrecto');return}
    modal=null;toast(r&&r.error==='pin_locked'?'Demasiados intentos, espera 15 min':'Error del servidor');render();
  };
  if(adminPin&&!err){run(adminPin);return}
  modal={type:'pin',title,run,err:err||'',d:{v:''}};render();
}
const VOW='aeiouáéíóú';
// Mezcla dos nombres: principio de uno + final del otro (Manuel + Cosmin → Manusmin)
function blend(x,y,avoid=[]){
  x=x.trim().split(/\s+/)[0];y=y.trim().split(/\s+/)[0];
  const c=new Set(),no=[x,y,...avoid].map(s=>s.toLowerCase());
  for(const [p,q] of [[x,y],[y,x]])
    for(let i=2;i<=Math.min(p.length-1,5);i++)for(let j=2;j<=Math.min(q.length-1,5);j++){
      const pre=p.slice(0,i),suf=q.slice(-j).toLowerCase(),n=pre+suf;
      const lv=VOW.includes(pre.slice(-1).toLowerCase()),rv=VOW.includes(suf[0]);
      if(lv===rv||n.length<5||n.length>10||no.includes(n.toLowerCase()))continue;
      c.add(n[0].toUpperCase()+n.slice(1));
    }
  const list=[...c];
  if(!list.length){const n=x.slice(0,Math.ceil(x.length/2))+y.slice(Math.floor(y.length/2)).toLowerCase();return n[0].toUpperCase()+n.slice(1)}
  return list[Math.floor(Math.random()*list.length)];
}
function genName(t,force){ // nombre mezclado para el equipo t cuando ya tiene sus 2 jugadores
  const d=modal.d,k=t?'lb':'la',o=t?'la':'lb';
  if(d.t[t].length<2){d[k]='';return}
  if(force||!d[k])d[k]=blend(pname(d.t[t][0]),pname(d.t[t][1]),[d[o],d[k]].filter(Boolean));
}
const allMatches=()=>[...S.league.matches,...S.league.pending];
function stats(){
  const P={},T={};
  S.league.players.forEach(p=>P[p.id]={id:p.id,name:p.name,pj:0,g:0,e:[0,0,0,0],o:[0,0,0]});
  allMatches().forEach(m=>{
    const by=m.d&&m.d.o&&m.d.o.by; // órdago: quién lo echó y si le salió bien
    if(by&&P[by]){P[by].o[0]++;if((m.a.includes(by)?0:1)===m.w)P[by].o[1]++}
    if(m.d&&Array.isArray(m.d.on))m.d.on.forEach(x=>{if(x&&P[x.by])P[x.by].o[2]++}); // órdagos no queridos
    [m.a,m.b].forEach((ids,t)=>{
    const win=m.w===t;
    const e=m.d&&m.d.e&&m.d.e[t];
    ids.forEach(id=>{if(P[id]){P[id].pj++;if(win)P[id].g++;if(e)e.forEach((v,i)=>P[id].e[i]+=v||0)}});
    const k=[...ids].sort((x,y)=>x-y).join('-'),o=T[k]||(T[k]={ids,pj:0,g:0,name:''});
    o.pj++;if(win)o.g++;o.name=t?m.nb:m.na;
  })});
  const ord=(x,y)=>y.g-x.g||y.g/(y.pj||1)-x.g/(x.pj||1)||x.pj-y.pj;
  return {players:Object.values(P).sort(ord),pairs:Object.values(T).sort(ord)};
}
// Balance de partidas entre las dos parejas de la partida en curso (mismos jugadores, da igual el nombre)
function h2h(m){
  const r=[0,0];if(!m||!m.league)return r;
  const key=ids=>[...ids].sort((x,y)=>x-y).join('-'),A=key(m.league.a),B=key(m.league.b);
  allMatches().forEach(x=>{const ka=key(x.a),kb=key(x.b);
    if(ka===A&&kb===B)r[x.w]++;else if(ka===B&&kb===A)r[1-x.w]++});
  return r;
}

const awName=(id,def)=>(S.league.titles&&S.league.titles[id])||def;
// Mayor ventaja que le sacó el rival al ganador a lo largo de la partida (solo si hay d.g)
function gdef(m){
  const g=m.d&&Array.isArray(m.d.g)?m.d.g:null;if(!g)return null;
  let r=0;for(let i=0;i+1<g.length;i+=2){const a=+g[i]||0,b=+g[i+1]||0;r=Math.max(r,m.w?a-b:b-a)}
  return r;
}
function mtags(m){const t=[],lo=m.w?m.ja:m.jb,de=gdef(m);
  if(lo<10)t.push('zapatero');if(de!==null&&de>=15)t.push('remontada');if(m.ja>=37&&m.jb>=37)t.push('de infarto');return t}
// Recorre todas las partidas una vez y deja por jugador: forma, rachas, compañeros, rivales, lances, órdagos y datos de motes
function lgData(){
  const L=S.league,ms=allMatches().slice().sort((x,y)=>x.date-y.date),P={},T={},ol=[0,0,0,0];
  const lan=l=>Number.isInteger(l)&&l>=0&&l<4;
  L.players.forEach(p=>P[p.id]={id:p.id,name:p.name,pj:0,g:0,res:[],ps:{},op:{},e:[0,0,0,0],en:0,ta:0,tw:0,tr:0,su:0,zap:0,rem:0});
  ms.forEach(m=>{
    const d=m.d||{},lo=m.w?m.ja:m.jb,wi=m.w?m.jb:m.ja,de=gdef(m);
    [m.a,m.b].forEach((ids,t)=>{
      const win=m.w===t,e=Array.isArray(d.e)&&Array.isArray(d.e[t])?d.e[t]:null,k=[...ids].sort((x,y)=>x-y).join('-'),o=T[k]||(T[k]={pj:0,g:0});
      o.pj++;if(win)o.g++;
      ids.forEach(id=>{const p=P[id];if(!p)return;
        p.pj++;if(win)p.g++;p.res.push(win?1:0);
        ids.forEach(q=>{if(q!==id){const x=p.ps[q]||(p.ps[q]={pj:0,g:0});x.pj++;if(win)x.g++}});
        (t?m.a:m.b).forEach(q=>{const x=p.op[q]||(p.op[q]={pj:0,g:0});x.pj++;if(win)x.g++});
        if(e){e.forEach((v,i)=>{if(i<4)p.e[i]+=v||0});p.en++}
        if(lo>=37)p.su++;
        if(win){p.zap=Math.max(p.zap,wi-lo);if(de)p.rem=Math.max(p.rem,de)}
      });
    });
    const by=d.o&&d.o.by,q=P[by];
    if(q){q.ta++;if((m.a.includes(by)?0:1)===m.w)q.tw++}
    if(d.o&&lan(d.o.l))ol[d.o.l]++;
    (Array.isArray(d.on)?d.on:[]).forEach(x=>{if(!x)return;if(P[x.by])P[x.by].tr++;if(lan(x.l))ol[x.l]++});
  });
  const list=Object.values(P);
  list.forEach(p=>{let w=0,l=0;p.bw=p.bl=0;
    p.res.forEach(r=>{if(r){w++;l=0}else{l++;w=0}p.bw=Math.max(p.bw,w);p.bl=Math.max(p.bl,l)});
    p.cw=w;p.cl=l;p.f5=p.res.slice(-5)});
  return {P,T,ms,ol,list};
}
// Mejor (dir 1: mayor, -1: menor) valor entre jugadores; devuelve todos los empatados
function bestOf(list,f,dir){let b=null,h=[];
  list.forEach(p=>{const v=f(p);if(v==null)return;
    if(b===null||(v-b)*dir>1e-9){b=v;h=[p]}else if(Math.abs(v-b)<=1e-9)h.push(p)});
  return {v:b,h};
}
const fmDots=p=>p.f5.length?`<span class="fm" aria-label="Últimos ${p.f5.length}: ${p.f5.map(r=>r?'ganó':'perdió').join(', ')}">${p.f5.map(r=>`<i class="dot ${r?'':'l'}"></i>`).join('')}</span>`:'';
const streakTx=p=>p.cw>=2?`<b class="sk">${p.cw} seguidas</b>`:p.cl>=2?`<b class="sk l">gafado ×${p.cl}</b>`:'';
function recHtml(D){ // récords de rachas de todos los tiempos

  const t=[w.h.length?`racha ganadora ${w.v} (${nm(w)})`:'',l.h.length?`racha perdedora ${l.v} (${nm(l)})`:''].filter(Boolean);
  return t.length?`<p class="rec">Récords: ${t.join(' · ')}</p>`:'';
}

// Diálogo de un jugador: forma, racha, mejor/peor compañero, bestia negra y cliente
function dPlayer(m){
  const p=lgData().P[m.id];
  if(!p)return `<h2>Jugador</h2><p>Ya no está en la liga.</p>${noGame}`;
  const rows=o=>Object.keys(o).map(k=>({id:+k,pj:o[k].pj,g:o[k].g})).filter(x=>x.pj>=2);
  const srt=(a,f)=>a.sort((x,y)=>f(y)-f(x)||y.pj-x.pj);
  const par=srt(rows(p.ps),x=>x.g/x.pj),opp=rows(p.op);
  const nem=srt(opp.filter(x=>x.pj-x.g>0),x=>(x.pj-x.g)/x.pj)[0],cli=srt(opp.filter(x=>x.g>0),x=>x.g/x.pj)[0];
  const who=(x,f)=>`${esc(pname(x.id))} · ${f(x)}`;

  ${p.cw>=1?kv('Racha actual',p.cw+(p.cw===1?' victoria':' victorias seguidas')):p.cl>=1?kv('Racha actual',p.cl+(p.cl===1?' derrota':' derrotas seguidas')):''}
  ${p.bw>=2||p.bl>=2?kv('Mejor / peor racha',`${p.bw} ganadas / ${p.bl} perdidas`):''}
  ${par.length?kv('Mejor compañero',who(par[0],x=>pcs(x.g,x.pj))):''}
  ${par.length>1?kv('Peor compañero',who(par[par.length-1],x=>pcs(x.g,x.pj))):''}
  ${nem?kv('Bestia negra',who(nem,x=>`pierde ${x.pj-x.g} de ${x.pj}`)):''}
  ${cli&&(!nem||cli.id!==nem.id)?kv('Cliente',who(cli,x=>`gana ${x.g} de ${x.pj}`)):''}
  ${par.length||nem||cli?'':'<div class="hint">Aún no hay datos de compañeros ni rivales (hacen falta 2 partidas juntos).</div>'}
  ${noGame}`;

// Gráfica del marcador de una partida (SVG a mano; colores de pareja por variables CSS)
function chart(m){
  const g=m.d&&Array.isArray(m.d.g)?m.d.g:null;if(!g||g.length<2)return '';
  const pts=[[0,0]];for(let i=0;i+1<g.length;i+=2)pts.push([+g[i]||0,+g[i+1]||0]);
  const z=pts[pts.length-1];if(z[0]!==m.ja||z[1]!==m.jb)pts.push([m.ja,m.jb]); // un órdago acaba sin movimiento de puntos
  const x0=24,x1=290,y0=10,y1=124,mx=Math.max(40,...pts.map(q=>Math.max(q[0],q[1]))),n=pts.length-1;
  const X=i=>(x0+(x1-x0)*i/n).toFixed(1),Y=v=>(y1-(y1-y0)*v/mx).toFixed(1);
  let gr='';for(let v=0;v<=mx;v+=10)gr+=`<line class="gr" x1="${x0}" x2="${x1}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${x0-4}" y="${+Y(v)+3}" text-anchor="end">${v}</text>`;
  const ln=(k,c)=>`<polyline class="${c}" points="${pts.map((q,i)=>X(i)+','+Y(q[k])).join(' ')}"/><circle class="${c}" cx="${X(n)}" cy="${Y(pts[n][k])}" r="3"/>`;
  return `<svg class="ch" viewBox="0 0 300 136" role="img" aria-label="Evolución del marcador: ${esc(m.na)} ${m.ja}, ${esc(m.nb)} ${m.jb}">${gr}${ln(1,'cb')}${ln(0,'ca')}</svg>`;
}
const mmss=t=>{const s=Math.round(t);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};

// Pronóstico para el diálogo de nueva partida: sin Elo, solo récords y % de victorias suavizado
function forecastHtml(A,B){
  const D=lgData(),P=D.P,key=ids=>[...ids].sort((x,y)=>x-y).join('-'),kA=key(A),kB=key(B),ids=[...A,...B];
  if(!ids.some(id=>P[id]&&P[id].pj))return '';
  const h=[0,0];D.ms.forEach(x=>{const a=key(x.a),b=key(x.b);if(a===kA&&b===kB)h[x.w]++;else if(a===kB&&b===kA)h[1-x.w]++});
  const rt=id=>P[id]?(P[id].g+2)/(P[id].pj+4):.5; // 2 victorias y 2 derrotas ficticias por jugador
  const sA=(rt(A[0])+rt(A[1]))/2,sB=(rt(B[0])+rt(B[1]))/2,pA=Math.round(100*sA*(1-sB)/(sA*(1-sB)+sB*(1-sA))),pB=100-pA;
  const nm=ids=>esc(ids.map(pname).join(' + '));
  const tr=(k,ids)=>{const o=D.T[k]||{pj:0,g:0};return `<div class="fl"><b>${nm(ids)}</b>: ${o.pj?`juntos ${o.g} G · ${o.pj-o.g} P`:'nunca han jugado juntos'}</div>`};
  const st=[],ps=ids.map(id=>P[id]).filter(Boolean),rec=Math.max(0,...D.list.map(p=>p.bw));
  ps.forEach(p=>{
    if(p.cw>=2)st.push(`${esc(p.name)} lleva ${p.cw} victorias seguidas${p.cw>=3&&p.cw>=rec?' (récord de la liga)':''}`);
    else if(p.cl>=2)st.push(`${esc(p.name)} lleva ${p.cl} derrotas seguidas: puede cortarlas`)});
  const ld=stats().players[0];
  if(ld&&ld.g>0){const side=ids.indexOf(ld.id),
    rv=(side>=0?(side<2?B:A):ids).map(id=>P[id]).filter(r=>r&&r.id!==ld.id&&r.g+1>=ld.g).map(r=>esc(r.name));
    if(rv.length)st.push(side>=0?`${esc(ld.name)} se juega el liderato: si pierde, ${rv.join(' y ')} le alcanza${rv.length>1?'n':''}`
      :`${rv.join(' y ')} puede${rv.length>1?'n':''} alcanzar al líder ${esc(ld.name)} si gana${rv.length>1?'n':''}`)}
  return `<div class="fc"><div class="fh"><b>Pronóstico</b><small>aproximado, sin Elo</small></div>
    <div class="fp"><span class="a">${pA}%</span><span class="b">${pB}%</span></div><div class="fgb"><i style="width:${pA}%"></i></div>
    <div class="fl">Entre estas parejas: <b>${h[0]}–${h[1]}</b></div>${tr(kA,A)}${tr(kB,B)}
    ${st.slice(0,4).map(t=>`<div class="fl">• ${t}</div>`).join('')}</div>`;
}

// Fila de una partida (lista de la liga y pantalla de todas las partidas)
function mRow(m){

/* Todas las partidas, con filtro: 1 jugador marcado → sus partidas; 2 → las que jugaron juntos de pareja.
   El filtro vive en memoria: se mantiene al abrir el detalle de una partida y volver. */
const mf={p:[],open:null,pp:[]};
function vMatches(){
  const L=S.league,sel=mf.p,all=allMatches().reverse();
  const team=(m,id)=>m.a.includes(id)?0:m.b.includes(id)?1:-1;
  const ms=sel.length===2?all.filter(m=>{const t=team(m,sel[0]);return t>=0&&t===team(m,sel[1])})
    :sel.length===1?all.filter(m=>team(m,sel[0])>=0):all;
  // Balance del filtro: victorias del jugador o de la pareja
  let rec=`<p class="mrec">${ms.length} partidas</p>`;
  if(sel.length){const g=ms.filter(m=>team(m,sel[0])===m.w).length;
    rec=`<p class="mrec"><b>${sel.map(pname).map(esc).join(' + ')}</b> · ${ms.length} ${ms.length===1?'partida':'partidas'} · ${g} G · ${ms.length-g} P${ms.length?` · ${Math.round(100*g/ms.length)}%`:''}</p>`}
  const pairs=stats().pairs.slice().sort((x,y)=>y.pj-x.pj).slice(0,8);
  const played=L.players.filter(p=>all.some(m=>team(m,p.id)>=0));
  const names=ids=>ids.map(pname).map(esc).join(' + ');
  // Desplegable abierto: Jugador (un toque filtra) o Pareja (habituales, o dos toques en cualquier jugador)
  const panel=mf.open==='p'
    ?`<div class="fpanel">${played.map(p=>`<button class="qp ${sel.length===1&&sel[0]===p.id?'on':''}" data-a="mfP" data-p="${p.id}">${esc(p.name)}</button>`).join('')}</div>`
    :mf.open==='pair'
    ?`<div class="fpanel">${pairs.length?`<small>Habituales</small>${pairs.map(o=>`<button class="qp ${sel.length===2&&o.ids.every(i=>sel.includes(i))?'on':''}" data-a="mfPair" data-p="${o.ids.join(',')}">${names(o.ids)}</button>`).join('')}`:''}
      <small>${mf.pp.length?`${names(mf.pp)} + …`:'O elige dos jugadores'}</small>${played.map(p=>`<button class="qp ${mf.pp.includes(p.id)?'on':''}" data-a="mfP2" data-p="${p.id}">${esc(p.name)}</button>`).join('')}</div>`:'';
  return `<div class="fbar">${bar('Todas las partidas')}
    <div class="frow">
      <button class="fbtn ${mf.open==='p'?'open':''} ${sel.length===1?'on':''}" data-a="mfOpen" data-p="p">${sel.length===1?names(sel):'Jugador'} <i>▾</i></button>
      <button class="fbtn ${mf.open==='pair'?'open':''} ${sel.length===2?'on':''}" data-a="mfOpen" data-p="pair">${sel.length===2?names(sel):'Pareja'} <i>▾</i></button>
      ${sel.length?`<button class="ic fx" data-a="mfClear" aria-label="Quitar filtro">✕</button>`:''}
    </div>${panel}</div>
  <section class="card">${rec}
    ${ms.length?ms.map(mRow).join(''):`<p class="hint">${sel.length===2?'No han jugado juntos de pareja. ¿Rivalidad eterna?':'No hay partidas.'}</p>`}
  </section>`;
}
function vLiga(){
  const L=S.league;

  `<section class="card lg"><h2>${esc(L.name)}</h2>
    <div class="status ${offline?'off':''}"><i></i>${offline?'Sin conexión':syncing?'Actualizando…':'Sincronizada'}${pend?` · ${pend} ${pend===1?'cambio pendiente':'cambios pendientes'} de subir`:''}</div>
  </section>
  <div class="cols"><section class="card"><h3>Jugadores</h3>
    ${L.players.length?head+st.players.map((o,i)=>`<div class="tr pl" data-a="pdet" data-p="${o.id}">${cells(o,i,o.name,'',(p=>p&&p.pj?`<small>${fmDots(p)}${streakTx(p)}</small>`:'')(D.P[o.id]))}</div>`).join('')+recHtml(D):`<p class="hint">${offline?'Sin conexión: no se pudo cargar la liga.':'Cargando jugadores…'}</p>`}

  ${st.players.some(o=>o.e.some(Boolean))?`<section class="card"><h3>Puntos por lance</h3>
    <div class="tr th"><span></span><span></span><span>Gr</span><span>Ch</span><span>Pa</span><span>Ju</span></div>
    ${[...st.players].filter(o=>o.pj).sort((x,y)=>y.e.reduce((a,b)=>a+b)-x.e.reduce((a,b)=>a+b)).map((o,i)=>`<div class="tr"><span class="pos">${i+1}</span><span class="nm">${esc(o.name)}</span>${o.e.map(v=>`<span>${v}</span>`).join('')}</div>`).join('')}
  </section>`:''}
  ${st.players.some(o=>o.o[0]||o.o[2])?`<section class="card"><h3>Órdagos</h3>
    <div class="tr th"><span></span><span></span><span>Ech</span><span>Gan</span><span>NQ</span><span>%</span></div>
    ${st.players.filter(o=>o.o[0]||o.o[2]).sort((x,y)=>y.o[1]-x.o[1]||y.o[0]-x.o[0]||y.o[2]-x.o[2]).map((o,i)=>`<div class="tr"><span class="pos">${i+1}</span><span class="nm">${esc(o.name)}</span><span>${o.o[0]}</span><span class="g">${o.o[1]}</span><span>${o.o[2]}</span><span>${o.o[0]?Math.round(100*o.o[1]/o.o[0])+'%':'–'}</span></div>`).join('')}
    <p class="rec">Ech = querido y echado · Gan = ganados · NQ = no queridos${D.ol.some(Boolean)?`<br>Por lance: ${D.ol.map((v,i)=>`${ENV[i]} ${v}`).join(' · ')}`:''}</p>
  </section>`:''}
  ${motesHtml(D)}
  <section class="card"><h3>Partidas</h3>
    ${ms.length?ms.slice(0,10).map(mRow).join('')+(ms.length>10?`<button class="btn ghost block more" data-a="go" data-p="partidas">Ver todas (${ms.length})</button>`:'')
    :'<p class="hint">Aún no hay partidas. Al terminar un mus se apunta sola (no hace falta que lo cantes).</p>'}
  </section>
  <button class="btn primary block" data-a="setup">Nueva partida</button></div>`;
}

      <span class="hd">${x.k==='g'?`${ENV[x.i]} · envite de ${x.v}`:x.k==='n'?`Órdago no querido · ${ENV[x.i]}`:x.k==='b'?BON[x.i][0]:x.n>0?'Punto directo':'Punto quitado'}</span>

// Jugadores de la liga que casan con lo escrito en el buscador (sin tildes ni mayúsculas), por orden alfabético
function pfilter(d){
  const nz=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(),q=nz(d.q||'');
  return S.league.players.filter(p=>!q||nz(p.name).includes(q)).sort((x,y)=>x.name.localeCompare(y.name,'es'));
}
function pgrid(d){
  if(!S.league.players.length)return `<p class="hint">${offline?'Sin conexión: no se pudo cargar la liga.':'Cargando jugadores…'}</p>`;
  const list=pfilter(d);
  if(!list.length){const n=(d.q||'').trim().replace(/\s+/g,' ');
    // Nadie casa: se ofrece darlo de alta en la liga (permanente y compartido, por eso solo con un toque explícito)
    return `<p class="hint">Nadie con ese nombre.</p>${!n?'':n.length>14?'<p class="hint">Un nombre nuevo admite 14 letras como máximo.</p>':`<button class="btn block" data-a="addPick">Añadir a «${esc(n)}»</button>`}`}
  return list.map(p=>{const t=d.t[0].includes(p.id)?0:d.t[1].includes(p.id)?1:-1;
    return `<button class="pc ${t<0?'':'t'+t}" data-a="pick" data-p="${p.id}" aria-pressed="${t>=0}">${esc(p.name)}${t<0?'':`<i>${t+1}</i>`}</button>`}).join('');
}

/* ───────── Acciones ───────── */
// Puntos que lleva cada equipo por lance en la partida en curso: [equipo][grande, chica, pares, juego]
const lances=m=>m.hist||(m.hist=[[0,0,0,0],[0,0,0,0]]);
// Historial de movimientos de la partida en curso (solo en este móvil; se vacía al empezar otra)
const logMove=(m,x)=>{const l=m.log||(m.log=[]);l.push({...x,pa:m.pa,pb:m.pb});if(l.length>400)l.shift()};
const tOf=(m,id)=>m.league.a.includes(id)?0:1; // equipo (0/1) de un jugador de la partida en curso
// Progresión del marcador: tras cada cambio se guarda [pa,pb]; a0/b0 = marcador antes (el primero abre la serie y marca la hora de inicio)
const prog=(m,a0,b0)=>{if(!m.t0){m.t0=Date.now();m.sc=[a0,b0]}m.sc.push(m.pa,m.pb)};
// Reduce una serie plana [pa,pb,…] a n parejas repartidas por igual, conservando la primera y la última
const dsamp=(g,n)=>{const k=g.length/2;if(k<=n)return g.slice();const r=[];for(let i=0;i<n;i++){const j=Math.round(i*(k-1)/(n-1));r.push(g[2*j],g[2*j+1])}return r};
function winGame(t,o){ // el equipo t gana la partida (o = órdago aceptado: {by,l,pa,pb}); se apunta en la liga
  stopHold();
  const m=S.mus,pa=t?m.pa:m.target,pb=t?m.target:m.pb,e=lances(m),on=m.on;
  if(o){const a0=m.pa,b0=m.pb;m.pa=pa;m.pb=pb;prog(m,a0,b0)} // un órdago acaba sin sumar con los botones: se añade el marcador final a la serie
  const d={e};if(o)d.o=o;if(on&&on.length)d.on=on;
  if(m.sc)d.g=dsamp(m.sc,120);d.t=m.t0?Math.round((Date.now()-m.t0)/1000):0;
  m.pa=m.pb=0;m.env=[0,0,0,0];m.hist=[[0,0,0,0],[0,0,0,0]];m.log=[];delete m.sc;delete m.t0;delete m.on;
  (m.ses||(m.ses=[0,0]))[t]++; // victorias de la sesión (mientras sigan las revanchas)
  if(m.league){
    m.recId=crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2,12);
    S.league.pending.push({uid:m.recId,date:Date.now(),a:m.league.a,b:m.league.b,na:m.a,nb:m.b,ja:pa,jb:pb,w:t,d});
  }
  modal={type:'win',t,pa,pb,o};buzz(60);commit();
  if(m.recId)sync();
}

/* ───────── Color de la app ─────────
   Cada móvil elige su color (S.settings.color). De él se toma el tono y la saturación y se generan
   todos los colores (fondo, superficies, acento, equipos) con luminosidades fijas, para que se lea bien
   en modo oscuro y claro elija el color que elija. Sin color elegido se usan los del CSS. */
const COLORS=['#ff6fb5','#ffc900','#4fc3f7','#7cf29a','#ff8a5c','#b69cff','#2fe0c9','#ff5a5a']; // colores planos y saturados, tipo pegatina
const CKEYS=['--bg','--surface','--surface2','--line','--text','--muted','--accent','--on-accent','--a','--a-soft','--b','--b-soft','--ok','--shadow'];
function toHS(hex){
  const n=parseInt(hex.slice(1),16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,l=(mx+mn)/2;
  if(!d)return[0,0];
  const s=d/(1-Math.abs(2*l-1));
  const h=mx===r?((g-b)/d+6)%6:mx===g?(b-r)/d+2:(r-g)/d+4;
  return[Math.round(h*60),Math.round(s*100)];
}
const isDark=()=>S.settings.theme==='dark'||(S.settings.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
// Colores que se pueden pintar uno a uno desde el pincel: [variable, nombre, para qué sirve]
const PAINT=[['--bg','Fondo','detrás de todo'],['--surface','Cristal','tinte de cajas y diálogos'],['--surface2','Cristal 2','tinte de fichas y ajustes'],
  ['--line','Tubo neutro','bordes sin color y reflejos'],['--text','Texto','letras'],['--muted','Texto suave','ayudas y fechas'],
  ['--accent','Neón principal','botones y títulos'],['--on-accent','Sobre neón','letra sobre tubos rellenos'],
  ['--a','Neón equipo 1','pareja de la izquierda'],['--b','Neón equipo 2','pareja de la derecha'],
  ['--ok','Bien','victorias y en línea'],['--danger','Peligro','borrar y errores'],['--warn','Aviso','órdago y avisos']];
// Retoques del usuario por modo: S.settings.custom = {dark:{'--bg':'#…'}, light:{…}}
const customOf=()=>{const c=S.settings.custom||{};return c[isDark()?'dark':'light']||{}};
// Valor actual de una variable en #rrggbb (para el selector de color)
const tokCv=document.createElement('canvas').getContext('2d');
function tokHex(k){const v=getComputedStyle(document.documentElement).getPropertyValue(k).trim();
  tokCv.fillStyle='#000';tokCv.fillStyle=v||'#000';const f=tokCv.fillStyle;
  if(f[0]==='#')return f;const m=f.match(/d+/g);return m?'#'+m.slice(0,3).map(x=>(+x).toString(16).padStart(2,'0')).join(''):'#000000'}
function paint(){
  const st=document.documentElement.style,hex=S.settings.color;
  [...CKEYS,'--danger','--warn'].forEach(k=>st.removeProperty(k));
  basePaint(st,hex);
  // retoques uno a uno; los suaves de equipo siguen a su color, y el equipo 1 sigue al acento si no se pintó aparte
  const cu=customOf();
  for(const k in cu)if(/^#[0-9a-f]{6}$/i.test(cu[k]))st.setProperty(k,cu[k]);
  if(cu['--accent']&&!cu['--a'])st.setProperty('--a',cu['--accent']);
  if(cu['--a']||cu['--accent'])st.setProperty('--a-soft','color-mix(in srgb,var(--a) 22%,transparent)');
  if(cu['--b'])st.setProperty('--b-soft','color-mix(in srgb,var(--b) 22%,transparent)');
}
// Paleta generada a partir de un solo color (color rápido)
function basePaint(st,hex){
  if(!/^#[0-9a-f]{6}$/i.test(hex||''))return;
  // Receta neón: en oscuro, fondo casi negro teñido y tubos muy vivos; en claro, vidrio pálido y tubos más hondos
  const[h,s0]=toHS(hex),gray=s0<8,s=gray?0:Math.max(75,Math.min(100,s0)),hb=(h+150)%360;
  const c=(H,S_,L,a)=>`hsl(${H} ${S_}% ${L}%${a==null?'':' / '+a})`;
  const v=isDark()
    ?{'--bg':c(h,gray?0:45,6),'--surface':c(h,gray?0:35,13),'--surface2':c(h,gray?0:32,20),'--line':c(h,gray?0:40,92),
      '--text':c(h,gray?0:40,94),'--muted':c(h,gray?0:18,72),'--accent':c(h,s,64),'--on-accent':c(h,gray?0:45,7),
      '--b':c(hb,gray?0:s,62),'--a-soft':c(h,s,64,.2),'--b-soft':c(hb,gray?0:s,62,.18),
      '--shadow':'4px 4px 0 color-mix(in srgb,var(--line) 12%,transparent)'}
    :{'--bg':c(h,gray?0:40,92),'--surface':'#fff','--surface2':c(h,gray?0:40,86),'--line':c(h,gray?0:45,14),
      '--text':c(h,gray?0:45,14),'--muted':c(h,gray?0:20,34),'--accent':c(h,s,40),'--on-accent':'#fff',
      '--b':c(hb,gray?0:s,34),'--a-soft':c(h,s,40,.18),'--b-soft':c(hb,gray?0:s,34,.18),
      '--shadow':'4px 4px 0 color-mix(in srgb,var(--line) 16%,transparent)'};
  v['--a']=v['--accent'];v['--ok']=isDark()?'#3dff8f':'#0a8a4c';
  for(const k in v)st.setProperty(k,v[k]);
}

// Pinta el HTML nuevo tocando solo lo que cambia: los nodos que siguen igual no se recrean,
// así no se repiten las animaciones de entrada (diálogos) ni hay parpadeo al pulsar.
function patch(el,html){
  const t=document.createElement(el.tagName);t.innerHTML=html;
  patchKids(el,t);
}
function patchKids(from,to){
  const a=[...from.childNodes],b=[...to.childNodes];
  b.forEach((n,i)=>{
    const o=a[i];
    if(!o)from.appendChild(n);
    else if(o.nodeType!==n.nodeType||o.nodeName!==n.nodeName)from.replaceChild(n,o);
    else if(o.nodeType===1)patchEl(o,n);
    else if(o.nodeValue!==n.nodeValue)o.nodeValue=n.nodeValue;
  });
  for(let i=b.length;i<a.length;i++)a[i].remove();
}
function patchEl(o,n){
  for(const{name}of[...o.attributes])if(!n.hasAttribute(name))o.removeAttribute(name);
  for(const{name,value}of[...n.attributes])if(o.getAttribute(name)!==value)o.setAttribute(name,value);
  if(o.tagName==='INPUT'&&o!==document.activeElement){const v=n.getAttribute('value')||'';if(o.value!==v)o.value=v}
  patchKids(o,n);
}
function render(){
  const locked=!S.code,v=locked?'lock':view(),st=S.settings;
  if(st.theme==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=st.theme;
  paint();
  const html=locked?vLock():v==='mus'?vMus():v==='settings'?vSettings():v==='liga'?vLiga():v==='partidas'?vMatches():vHome();
  const app=document.getElementById('app');
  app.className='v-'+(['mus','settings','liga','partidas'].includes(v)?v:'home');
  landscape(v==='mus');
  patch(app,html);
  patch(document.getElementById('modal'),locked?'':vModal());
  document.querySelector('meta[name=theme-color]').content=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  wake();
}
// Render tras sincronizar: no pisa un campo en el que se está escribiendo
let renderLater=false;
function soft(){const a=document.activeElement;if(a&&a.tagName==='INPUT'){renderLater=true;return}render()}
document.addEventListener('focusout',()=>{if(renderLater)setTimeout(()=>{if(renderLater){renderLater=false;soft()}},400)});

let holdT,holdI,held=false;
function stopHold(){clearTimeout(holdT);clearInterval(holdI)}
document.addEventListener('pointerdown',e=>{
  held=false;stopHold();
  const b=e.target.closest('[data-hold]');if(!b||b.disabled)return;
  const a=b.dataset.a,p=b.dataset.p;
  holdT=setTimeout(()=>{held=true;holdI=setInterval(()=>{if(modal){stopHold();return}run(a,p)},110)},450);
});
['pointerup','pointercancel','blur'].forEach(ev=>addEventListener(ev,stopHold));
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  if(b.classList.contains('overlay')&&e.target!==b)return;
  if(held){held=false;return}
  run(b.dataset.a,b.dataset.p);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.g){lgDraft[t.dataset.g]=t.value;return}
  if(t.dataset.tok){const c=S.settings.custom=S.settings.custom||{},m=isDark()?'dark':'light';(c[m]=c[m]||{})[t.dataset.tok]=t.value;save();render();return}
  if(t.dataset.color){S.settings.color=t.value;save();render();return} // vista previa mientras se mueve el selector
  if(modal&&t.dataset.k)modal.d[t.dataset.k]=t.value;
  if(modal&&t.dataset.k==='q'){const g=document.getElementById('pgrid');if(g)patch(g,pgrid(modal.d))} // filtra sin perder el foco
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter){run(e.target.dataset.enter);return}
  if(e.key==='Escape'&&modal&&modal.type!=='win'){modal=null;render()}});
document.addEventListener('contextmenu',e=>{if(!e.target.closest('input'))e.preventDefault()});
addEventListener('hashchange',()=>{modal=null;render();if(view()==='liga')sync()});
addEventListener('online',sync);

/* pantalla encendida */
let wl=null;
async function wake(){
  const want=S.code&&S.settings.keepOn&&view()==='mus'&&document.visibilityState==='visible';
  try{
    if(want&&!wl&&navigator.wakeLock){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}
    else if(!want&&wl){const w=wl;wl=null;await w.release()}
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{wake();if(document.visibilityState==='visible')sync()});
// Botón atrás de Android (lo llama MainActivity): cierra el diálogo abierto o vuelve a la pestaña de inicio.
// Devuelve false solo en inicio sin diálogo, y entonces Android sale de la app.
window.museteBack=function(){
  if(!S.code)return false; // pantalla de acceso: Android sale de la app
  if(modal&&modal.type!=='win'){modal=null;render();return true}
  if(view()==='partidas'){back();return true} // de todas las partidas se vuelve a la liga
  if(view()!=='home'){depth=0;location.replace('#home');return true} // la partida sigue guardada: "Continuar"
  return false;
};
// Solo la partida obliga a horizontal. En la app Android lo fija el sistema (MuseteNative);
// en navegador se intenta el bloqueo y, si no se puede (iPhone), el CSS gira la interfaz.
let isLand=null;
function landscape(on){
  if(on===isLand)return;isLand=on;
  document.documentElement.dataset.v=on?'mus':'';
  try{
    if(window.MuseteNative)window.MuseteNative.setLandscape(on);
    else if(screen.orientation&&screen.orientation.lock){if(on)screen.orientation.lock('landscape').catch(()=>{});else screen.orientation.unlock()}
  }catch(e){}
}
render();sync();
// Actualización: al abrir y al volver a la app se mira si hay versión publicada nueva y, si la hay, se recarga.
// BUILD lo cambia "npm run publicar" en la copia publicada; en desarrollo vale 'dev' y no se comprueba.
const BUILD='20261118163305';
let upChecking=false;
async function checkUpdate(){
  if(BUILD==='dev'||upChecking||!navigator.onLine||modal)return; // con un diálogo abierto se espera a la próxima
  upChecking=true;
  try{
    const html=await (await fetch('./?u='+Date.now(),{cache:'no-store'})).text();
    const m=html.match(/const BUILD='([^']+)'/);
    if(m&&m[1]!==BUILD&&m[1]!=='dev'){toast('Actualizando…');setTimeout(()=>location.reload(),400)}
  }catch(e){}
  upChecking=false;
}
checkUpdate();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
// Versión publicada (navegador y app Android, que la carga de GitHub Pages): funciona sin conexión
// y se actualiza sola. No en el servidor de desarrollo ni en una copia empaquetada (https://localhost).
if('serviceWorker' in navigator&&location.protocol==='https:'&&location.hostname!=='localhost')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
