.tcard.t0{--c:var(--a);--soft:var(--a-soft)}.tcard.t1{--c:var(--b);--soft:var(--b-soft)}
.tcard>div{min-width:0}
.tcard small{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.tcard b{display:block;font:700 22px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard b.empty{font:600 17px var(--ui)}
.tcard span:not(.ic){display:block;font-size:13px;color:var(--muted)}
.tcard:active{filter:brightness(1.15)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.slot{display:flex;align-items:center;gap:2px;min-height:60px;padding:6px 4px 6px 12px;border-radius:14px;background:var(--soft);border-left:4px solid var(--c);min-width:0}
.slot.t0{--c:var(--a);--soft:var(--a-soft)}.slot.t1{--c:var(--b);--soft:var(--b-soft)}
.slot.act{box-shadow:inset 0 0 0 1.5px var(--c)}
.slot>div{flex:1;min-width:0}
.slot small{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.slot b{display:block;font:700 19px var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot b.empty{font-weight:500;font-size:16px;color:var(--muted)}
.slot span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .ic{width:36px;height:36px}
.quick{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:4px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.qp{flex:none;height:36px;padding:0 12px;border-radius:99px;font-size:13px;color:var(--muted);white-space:nowrap;box-shadow:inset 0 0 0 1px var(--line)}
.qp:active{background:var(--surface2)}
.search{width:100%;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:0 12px;margin-bottom:8px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.pc{height:44px;padding:0 8px;border-radius:12px;background:var(--surface2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc.t0{background:var(--a);color:var(--bg)}.pc.t1{background:var(--b);color:var(--bg)}
.pc i{font-style:normal;font-size:11px;margin-left:6px;opacity:.75}
.sheet.wide{max-width:760px}
.ogrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ocol{display:flex;flex-direction:column;gap:6px;min-width:0;--c:var(--a)}.ocol.t1{--c:var(--b)}
.ocol small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.ocol .btn{width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.owin{box-shadow:inset 0 0 0 1.5px var(--c);background:transparent;color:var(--c)}
.owin.on,.oby.on{background:var(--c);color:var(--bg);box-shadow:none}
.oby{min-height:42px}
.og{font-style:normal;font-size:12px;color:var(--muted);margin-left:6px}
.plist{margin:0 -4px;--c:var(--a)}.plist.t1{--c:var(--b)}
.prow{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:54px;padding:0 10px;border-top:1px solid var(--line);font-weight:600;text-align:left}
.prow i{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;font-style:normal;font-size:15px;color:var(--bg)}
.prow.on{color:var(--c)}
.prow.on i{background:var(--c);box-shadow:none}.prow.on i::after{content:"✓"}
.hint,.sheet p.hint{color:var(--muted);font-size:14px;margin:8px 0}
.pl{cursor:pointer}.pl:active{background:var(--surface2)}
.fm{display:inline-flex;gap:3px;align-items:center;vertical-align:middle;margin-right:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.l{background:transparent;box-shadow:inset 0 0 0 2px var(--danger)}
.sk{font-weight:600;font-size:12px;color:var(--ok)}.sk.l{color:var(--danger)}
.rec{font-size:13px;color:var(--muted);margin:8px 0 0}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.kv span{color:var(--muted);flex:none}.kv b{font-weight:600;text-align:right;min-width:0}
.aw{padding:8px 0;border-top:1px solid var(--line)}
.aw .ah{display:flex;justify-content:space-between;align-items:center;gap:8px}
.an{font-weight:700;text-align:left;min-height:36px}.an i{font-style:normal;color:var(--muted);font-size:13px;margin-left:4px}
.aw .av{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600;font-size:14px;white-space:nowrap}
.aw .ar{font-size:12px;color:var(--muted)}.aw .ao{font-size:14px;font-weight:600;margin-top:2px}
.tg{display:inline-block;font-style:normal;font-size:11px;font-weight:600;padding:0 6px;border-radius:99px;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted);margin-left:6px;white-space:nowrap}
.match{cursor:pointer}
.more{margin-top:10px}
/* filtros de "Todas las partidas": fijos arriba junto a la barra */
/* #app deja arriba el hueco de la barra de estado (safe-area); la barra fija sube hasta el borde
   y rellena ese hueco con fondo, para que la lista no se vea por detrás de la hora y los iconos */
.fbar{--sat:var(--st);position:sticky;top:calc(-1*var(--sat));margin-top:calc(-1*var(--sat));padding-top:var(--sat);
  z-index:3;background:var(--bg);padding-bottom:8px;margin-bottom:4px}
.frow{display:flex;gap:8px;align-items:center}
.fbtn{flex:1;min-width:0;height:40px;padding:0 12px;border-radius:99px;font-size:14px;font-weight:500;color:var(--text);
  box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbtn i{font-style:normal;font-size:11px;color:var(--muted);transition:transform .15s}
.fbtn.open i{transform:rotate(180deg)}
.fbtn.on{background:var(--accent);color:var(--on-accent);box-shadow:none}.fbtn.on i{color:inherit}
.fx{width:40px;height:40px}
.fpanel{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding:10px;border-radius:16px;background:var(--surface);border:1px solid var(--line);max-height:42vh;overflow:auto}
.fpanel small{width:100%;font-size:12px;color:var(--muted);margin:2px 2px 0}
.fpanel .qp{height:34px}
.qp.on{background:var(--accent);color:var(--on-accent);box-shadow:none}
.mrec{margin:0 0 8px;font-size:14px;color:var(--muted)}.mrec b{color:var(--text)}
.ch{width:100%;height:auto;margin:6px 0}.ch .gr{stroke:var(--line);stroke-width:1}.ch text{fill:var(--muted);font-size:9px}
.ch .ca,.ch .cb{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ch .ca{stroke:var(--a)}.ch .cb{stroke:var(--b)}.ch circle.ca{fill:var(--a);stroke:none}.ch circle.cb{fill:var(--b);stroke:none}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;font-weight:600}.lgd .la{color:var(--a)}.lgd .lb{color:var(--b)}
.fc{margin:10px 0 2px;padding:8px 10px;border-radius:14px;background:var(--bg);border:1px solid var(--line);font-size:13px}
.fc .fh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.fc .fh small{color:var(--muted);font-size:11px}
.fc .fp{display:flex;justify-content:space-between;font:700 20px var(--display);font-variant-numeric:tabular-nums;margin-top:2px}
.fc .fp .a{color:var(--a)}.fc .fp .b{color:var(--b)}

.fc div.fl{color:var(--muted);margin-top:2px}.fc div.fl b{color:var(--text);font-weight:600}

/* ajustes */
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px;min-height:64px;width:100%;text-align:left}
.set small{display:block;color:var(--muted);font-size:13px}
.sw{width:50px;height:30px;border-radius:99px;background:var(--surface2);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.sw.on{background:var(--accent)}.sw.on::after{transform:translateX(20px);background:var(--on-accent)}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;min-height:40px;padding:0 12px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.note{color:var(--muted);font-size:13px;text-align:center;margin-top:18px}

/* hojas / diálogos */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10;animation:fade .15s}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:calc(var(--H)*.96);overflow:auto;border-radius:24px 24px 0 0;
  padding:20px 16px calc(16px + var(--sb));box-shadow:var(--shadow);animation:up .2s cubic-bezier(.2,.8,.2,1)}
.sheet h2{margin:0 0 4px;font:700 24px var(--display)}
.sheet p{margin:0 0 14px;color:var(--muted)}
.sheet .row{margin-top:14px}
.field{display:block;margin-bottom:10px}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input,.pin input{width:100%;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:0 12px}
.pin{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.pin input{flex:1;min-width:0}
.pin .btn{flex:none}
.line{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0}
.win{text-align:center;padding:10px 0 4px}
.win .big{font:700 34px/1.1 var(--display);margin:6px 0}
.win .res{font:700 56px/1 var(--display);font-variant-numeric:tabular-nums;margin:10px 0 2px}
.win .res span.t0{color:var(--a)}.win .res span.t1{color:var(--b)}
#toast{position:absolute;left:50%;top:calc(6px + var(--st));transform:translate(-50%,-20px);background:var(--text);color:var(--bg);
  padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* «¿De quién?» tras una jugada: arriba al centro como el aviso, sin tapar marcadores ni botones; solo los chips reciben toques */
#who{position:absolute;left:50%;top:calc(6px + var(--st));transform:translate(-50%,-30px);display:flex;align-items:center;gap:6px;max-width:min(92%,520px);
  padding:3px 3px 3px 14px;border-radius:99px;font-weight:900;font-size:13px;white-space:nowrap;opacity:0;pointer-events:none;
  transition:transform .3s var(--pop),opacity .2s;z-index:21}
#who.t0{--c:var(--a)}#who.t1{--c:var(--b)}
#who.show{opacity:1;transform:translate(-50%,0)}#who.show button{pointer-events:auto}
#who span{overflow:hidden;text-overflow:ellipsis;min-width:0}
#who button{flex:none;height:38px;max-width:130px;padding:0 14px;border-radius:99px;background:var(--c);color:var(--on-accent);font-weight:900;font-size:14px;overflow:hidden;text-overflow:ellipsis}
#who{background:var(--surface);color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line),0 6px 18px rgba(0,0,0,.3)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* diseño horizontal (único) */
  #app.v-settings{max-width:560px}
  .bar{height:46px}
  /* mus: equipo 1 | envites | equipo 2; abajo deshacer | historial | órdago. Sin scroll */
  #app.v-mus{display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:auto minmax(0,1fr) auto;column-gap:8px;height:100%;min-height:0;
    padding-bottom:calc(10px + var(--sb))}
  .v-mus .bar{grid-column:1/-1}
  .v-mus .teams{display:contents}
  .v-mus .team{grid-row:2}
  .v-mus .team.t0{grid-column:1}.v-mus .team.t1{grid-column:3}
  .v-mus .envs{grid-column:2;grid-row:2}
  .v-mus .undoB{grid-column:1;grid-row:3;justify-self:center}
  .v-mus .histB{grid-column:2;grid-row:3;justify-self:center}
  .v-mus .ordago{grid-column:3;grid-row:3;justify-self:center}
  @media (orientation:landscape){
  /* inicio: tarjetas lado a lado */
  #app.v-home{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;align-content:start}
  .v-home .bar{grid-column:1/-1;margin-bottom:-46px}
  .v-home .hero{grid-column:1/-1;padding:10px 4px 12px}
  .v-home .hero .logo{font-size:36px}
  .v-home .game{margin:0;display:flex;flex-direction:column}
  .v-home .game .row{margin-top:auto}
  /* liga: tablas en dos columnas */
  .v-liga .cols{columns:2;column-gap:12px}
  .v-liga .cols>*{break-inside:avoid}
  .v-liga .lg{display:flex;align-items:baseline;gap:12px;padding:8px 14px}
  .v-liga .lg .status{margin:0}
  }
  .sheet{padding-top:12px}
  .sheet p{margin-bottom:8px}
  .sheet .hrow:first-of-type{border-top:0}
  .tcard{min-height:58px;padding-top:5px;padding-bottom:5px}
  .sheet .row{margin-top:8px}

/* ═════════ Original cristal: el verde de siempre, con superficies de vidrio ═════════
   Todo cuelga de las mismas variables que pinta paint(): el vidrio se tiñe con --surface/--surface2,
   el fondo lleva dos halos con los colores de equipo (--a/--b) para que el desenfoque se note. */
:root{--warn:#f0cf62;
  --gal:58%;--gal2:52%;
  --glass:color-mix(in srgb,var(--surface) var(--gal),transparent);
  --glass2:color-mix(in srgb,var(--surface2) var(--gal2),transparent);
  --edge:color-mix(in srgb,var(--text) 13%,transparent);
  --shine:inset 0 1px 0 color-mix(in srgb,#fff 10%,transparent);
  --blur:blur(18px) saturate(1.5)}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--warn:#a87a00;--gal:66%;--gal2:62%;--shine:inset 0 1px 0 rgba(255,255,255,.75)}}
:root[data-theme=light]{--warn:#a87a00;--gal:66%;--gal2:62%;--shine:inset 0 1px 0 rgba(255,255,255,.75)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root:root:root{--gal:96%;--gal2:96%}}

body{background:radial-gradient(70vmax 55vmax at 0% 0%,color-mix(in srgb,var(--a) 22%,transparent),transparent 70%),
  radial-gradient(65vmax 50vmax at 100% 100%,color-mix(in srgb,var(--b) 20%,transparent),transparent 70%),var(--bg) fixed}

/* piezas de vidrio (pocas y grandes: el desenfoque cuesta) */
.game,.card,.set,.sheet,.fpanel{background:var(--glass);border:1px solid var(--edge);box-shadow:var(--shine),0 8px 28px rgba(0,0,0,.18);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.game{border-radius:28px;padding:18px}
.card{border-radius:24px}
.set{border-radius:20px}
.fc,.codebox{background:var(--glass2);border:1px solid var(--edge);box-shadow:var(--shine)}
.codebox{border-style:dashed}
.search,.field input,.pin input{background:var(--glass2);border:1px solid var(--edge);box-shadow:var(--shine)}

/* botones: vidrio claro; el principal, color sólido con brillo */
.btn{background:var(--glass2);box-shadow:var(--shine),inset 0 0 0 1px var(--edge)}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--edge)}
.ic:active{background:var(--glass2)}
.bar .ic{background:var(--glass);border:1px solid var(--edge);box-shadow:var(--shine);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.bar .ic+.ic{margin-left:4px}
.brushb svg{width:22px;height:22px}
.seg{background:var(--glass2);box-shadow:inset 0 0 0 1px var(--edge)}
.sw{background:var(--glass2);box-shadow:inset 0 0 0 1px var(--edge)}
.chip,.qp,.fbtn,.pill,.bon button{box-shadow:var(--shine),inset 0 0 0 1px var(--edge);background:var(--glass2)}
.chip.t0{background:var(--a)}.chip.t1{background:var(--b)}
.qp.on,.fbtn.on{background:var(--accent);box-shadow:none}
.pc{background:var(--glass2);box-shadow:var(--shine),inset 0 0 0 1px var(--edge)}
.pc.t0{background:var(--a)}.pc.t1{background:var(--b)}
.tcard,.slot,.pairname{box-shadow:var(--shine),inset 0 0 0 1px var(--edge)}
.slot.act{box-shadow:inset 0 0 0 2px var(--c)}
.tg{color:var(--warn);box-shadow:inset 0 0 0 1px currentColor}
.prow,.tr,.match,.kv,.aw,.hrow{border-top-color:var(--edge)}

/* filtros fijos: vidrio esmerilado */
.fbar{background:color-mix(in srgb,var(--bg) 70%,transparent);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.fbar{background:var(--bg)}}
.fc .fgb{height:6px;border-radius:3px;background:var(--b);overflow:hidden;margin:2px 0 6px}.fc .fgb i{display:block;height:100%;background:var(--a)}

/* hojas: vidrio con asa */
.overlay{background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.overlay{background:rgba(0,0,0,.6)}}
.sheet{border-radius:30px 30px 0 0;border-bottom:0;position:relative;padding-top:22px}
.sheet::before{content:"";position:absolute;top:8px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:var(--edge)}
#toast{background:color-mix(in srgb,var(--text) 88%,transparent);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
#who{background:var(--glass2);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--shine),inset 0 0 0 1px var(--edge),0 6px 18px rgba(0,0,0,.25)}

/* mus: cada pareja en su panel de vidrio con su color; envites en otro */
.v-mus .team{background:color-mix(in srgb,var(--c) 9%,var(--glass));border:1px solid color-mix(in srgb,var(--c) 30%,var(--edge));border-radius:28px;
  box-shadow:var(--shine);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);padding:4px 6px;margin-bottom:8px}
.team.t0{--c:var(--a)}.team.t1{--c:var(--b)}
.tname{display:flex;align-items:center;gap:8px;color:var(--c)}
.tname .tn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.tname .ses{flex:none;min-width:28px;height:28px;padding:0 6px;border-radius:99px;display:grid;place-items:center;font-size:15px;
  background:var(--glass2);color:var(--text);box-shadow:inset 0 0 0 1px var(--edge)}
button.score{color:var(--text)}
.pm .plus{background:var(--c);color:var(--on-accent);box-shadow:0 6px 16px color-mix(in srgb,var(--c) 35%,transparent)}
.pm .minus{background:var(--glass2);box-shadow:inset 0 0 0 1px var(--edge)}
.v-mus .envs{background:var(--glass);border:1px solid var(--edge);border-radius:28px;box-shadow:var(--shine);padding:2px 6px;margin-bottom:8px;
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.give{background:var(--glass2);box-shadow:inset 0 0 0 1px var(--edge)}
.give.t0:not(:disabled):not(.cero){background:var(--a);color:var(--on-accent)}.give.t1:not(:disabled):not(.cero){background:var(--b);color:var(--on-accent)}
.env .num{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.env .num small{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.env .num b{font:400 26px/1 var(--ui);font-variant-numeric:tabular-nums}
.tally{background:var(--glass2);box-shadow:var(--shine),inset 0 0 0 1px var(--edge)}
.ordago{color:var(--warn);box-shadow:var(--shine),inset 0 0 0 1.5px var(--warn);background:var(--glass2)}
.undoB{background:var(--glass2);border-radius:50%;width:48px;height:48px;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--edge)}
.undoB svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* pincel "Pinta tu Musete" */
.ptitle{font:700 17px var(--display);margin:14px 0 8px;display:flex;align-items:baseline;gap:8px}.ptitle small{font:500 12px var(--ui);color:var(--muted)}
.paints{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:6px}

<body>
<div id="root"><div id="app"></div><div id="modal"></div><div id="toast" role="status"></div><div id="who" role="status"></div></div>
<script>
'use strict';
/* ───────── Servidor de la liga (Supabase) ─────────
   Clave pública: solo permite llamar a las funciones league_*; las tablas están cerradas con RLS. */
const SB_URL='https://newrdgvflijdwtrjpeqn.supabase.co';
const SB_KEY='sb_publishable_hQhT7tuba2e-DYUMIhbl3Q_VduFcF8p';
const ERR={LEAGUE_NOT_FOUND:'No existe ninguna liga con ese código',NAME_TAKEN:'Ya existe ese jugador',
  PLAYER_IN_USE:'Tiene partidas: no se puede quitar',bad_code:'Código de la liga incorrecto',BAD_NAME:'Nombre no válido',BAD_PLAYERS:'Jugadores no válidos',TOO_MANY_PLAYERS:'Demasiados jugadores'};
// quiet=true: un bad_code no expulsa a la pantalla de acceso (lo usa la propia validación del código)
async function rpc(fn,args,quiet){
  let r;
  try{r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(args)})}
  catch(e){const er=new Error('Sin conexión');er.net=true;throw er}
  const j=await r.json().catch(()=>null);
  if(!r.ok){
    if(String(j&&j.message||'').includes('bad_code')){ // código rotado o inválido
      const er=new Error(ERR.bad_code);er.code='bad_code';if(!quiet)lockOut('El código de la liga ha cambiado');throw er}
    const er=new Error(ERR[j&&j.message]||'Error del servidor');er.code=j&&j.message;throw er}
  return j;
}

/* ───────── Estado ───────── */
const KEY='musete.v1';
// El código de la liga es una contraseña que teclea el usuario: se guarda en S.code (localStorage) y nunca se muestra
const newLeague=()=>({name:'Liga Musete',players:[],matches:[],pending:[],dels:[],titles:{}});
const DEF={settings:{keepOn:true,theme:'auto',haptics:true,skin:'neon'},
  musDef:{t:[[],[]]},
  code:'',league:newLeague(),mus:null};
const ENV=['Grande','Chica','Pares','Juego'];
// Jugadas que se cobran con un toque: [nombre, puntos, lance al que cuentan]
const BON=[['Par',1,2],['Trío',2,2],['Duples',3,2],['31',3,3],['32+',2,3]];
let S=load(), modal=null, depth=0;
const undo={mus:[]};

function load(){
  const d=JSON.parse(JSON.stringify(DEF));
  try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');
    const o={settings:{...d.settings,...s.settings},musDef:{...d.musDef,...s.musDef},
      mus:s.mus&&s.mus.target===40&&s.mus.league?s.mus:null, // partidas de versiones anteriores se descartan
      code:typeof s.code==='string'?s.code:'',
      league:s.league?{...d.league,...s.league,dels:[]}:d.league}; // dels: los borrados ahora exigen PIN y ya no se encolan
    delete o.league.code; // versiones anteriores guardaban aquí el código fijo
    return o;
  }catch(e){return d}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function snap(g){undo[g].push(JSON.stringify(S[g]));if(undo[g].length>200)undo[g].shift()}
function commit(){save();render()}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const view=()=>{const v=location.hash.slice(1)||'home';return v==='mus'&&!S.mus?'home':v};
function go(v){if(location.hash.slice(1)===v){render();return}depth++;location.hash=v}
function back(){if(depth>0){depth--;history.back()}else{location.replace('#home')}}
function buzz(ms){if(S.settings.haptics&&navigator.vibrate)try{navigator.vibrate(ms||8)}catch(e){}}
let toastT;function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2200)}

/* ───────── Liga: sincronización ───────── */
const lgDraft={name:'',code:'',lp:'',lk:'',lv:''};
let lockErr='',lockBusy=false,adminPin=null,trash=[]; // adminPin: solo en memoria, nunca se guarda
let syncing=false,again=false,offline=false,busy=false;
const pname=id=>(S.league.players.find(p=>p.id===id)||{name:'—'}).name;
function applyState(st){
  const L=S.league;
  L.name=st.name;L.players=st.players;L.titles=st.titles||{}; // nombres de los motes, compartidos
  const X=L.xd||{}; // ficha post-partida apuntada aquí después de subir la partida (solo en este móvil)
  L.matches=st.matches.map(m=>({...m,date:Date.parse(m.date),...(X[m.uid]?{d:{...(m.d||{}),...X[m.uid]}}:{})})).filter(m=>!L.dels.includes(m.uid));
  save();
}
// Sube lo pendiente (partidas apuntadas o borradas sin cobertura) y baja el estado de la liga
async function sync(){
  const L=S.league;if(!S.code)return;
  if(syncing){again=true;return}
  syncing=true;soft();
  try{
    while(L.pending.length){
      const m=L.pending[0];
      try{await rpc('league_match_add',{p_code:S.code,p_uid:m.uid,p_a1:m.a[0],p_a2:m.a[1],p_b1:m.b[0],p_b2:m.b[1],
        p_na:m.na,p_nb:m.nb,p_ja:m.ja,p_jb:m.jb,p_w:m.w,p_date:new Date(m.date).toISOString(),p_detail:m.d||null})}
      catch(e){if(e.net||e.code==='LEAGUE_NOT_FOUND'||e.code==='bad_code')throw e} // rechazada por el servidor: se descarta
      const i=L.pending.indexOf(m);if(i>=0)L.pending.splice(i,1);save();
    }
    const st=await rpc('league_state',{p_code:S.code});
    if(S.league===L){if(st)applyState(st);else throw Object.assign(new Error(ERR.LEAGUE_NOT_FOUND),{code:'LEAGUE_NOT_FOUND'})}
    offline=false;
  }catch(e){offline=!!e.net;if(!e.net&&e.code!=='bad_code')toast(e.message)}
  syncing=false;soft();
  if(again){again=false;sync()}
}
// Acción de red lanzada por el usuario (crear, unirse, jugadores)
async function net(fn,args,after){
  if(busy)return;busy=true;
  try{const st=await rpc(fn,args);if(st)applyState(st);offline=false;if(after)after(st)}
  catch(e){if(e.net)offline=true;if(e.code!=='bad_code')toast(e.message)}
  busy=false;render();
}
/* ───────── Acceso con código de la liga ───────── */
function lockOut(msg){S.code='';adminPin=null;trash=[];modal=null;lockErr=msg||'';save();render()}
async function enterLeague(){
  if(lockBusy)return;
  const c=String(lgDraft.lk||'').trim().toUpperCase();
  if(!c){lockErr='Escribe el código de la liga';render();return}
  lockBusy=true;lockErr='';render();
  try{
    const st=await rpc('league_state',{p_code:c},true);
    if(!st)throw Object.assign(new Error(ERR.bad_code),{code:'bad_code'});
    S.code=c;lgDraft.lk='';lockBusy=false;applyState(st);offline=false;save();render();sync();return;
  }catch(e){lockErr=e.net?'Sin conexión: no se puede comprobar el código':e.code==='bad_code'?'Código incorrecto':e.message}
  lockBusy=false;render();
}
// Acción de administrador (borrar partida, renombrar mote, papelera): pide PIN y llama al RPC con p_pin.
// El PIN solo se recuerda en memoria tras usarlo con éxito; bad_pin lo olvida y lo vuelve a pedir.
function adminDo(title,fn,args,onOk,err){
  const run=async pin=>{
    if(busy)return;busy=true;let r=null;
    try{r=await rpc(fn,{...args,p_code:S.code,p_pin:pin})}
    catch(e){busy=false;if(e.net)offline=true;if(e.code!=='bad_code')toast(e.message);render();return}
    busy=false;
    if(r&&r.ok){adminPin=pin;modal=null;render();onOk(r);return}
    adminPin=null;
    if(r&&r.error==='bad_pin'){adminDo(title,fn,args,onOk,'PIN incorrecto');return}
    modal=null;toast(r&&r.error==='pin_locked'?'Demasiados intentos, espera 15 min':'Error del servidor');render();
  };
  if(adminPin&&!err){run(adminPin);return}
  modal={type:'pin',title,run,err:err||'',d:{v:''}};render();
}
const VOW='aeiouáéíóú';
// Mezcla dos nombres: principio de uno + final del otro (Manuel + Cosmin → Manusmin)
function blend(x,y,avoid=[]){
  x=x.trim().split(/\s+/)[0];y=y.trim().split(/\s+/)[0];
  const c=new Set(),no=[x,y,...avoid].map(s=>s.toLowerCase());
  for(const [p,q] of [[x,y],[y,x]])
    for(let i=2;i<=Math.min(p.length-1,5);i++)for(let j=2;j<=Math.min(q.length-1,5);j++){
      const pre=p.slice(0,i),suf=q.slice(-j).toLowerCase(),n=pre+suf;
      const lv=VOW.includes(pre.slice(-1).toLowerCase()),rv=VOW.includes(suf[0]);
      if(lv===rv||n.length<5||n.length>10||no.includes(n.toLowerCase()))continue;
      c.add(n[0].toUpperCase()+n.slice(1));
    }
  const list=[...c];
  if(!list.length){const n=x.slice(0,Math.ceil(x.length/2))+y.slice(Math.floor(y.length/2)).toLowerCase();return n[0].toUpperCase()+n.slice(1)}
  return list[Math.floor(Math.random()*list.length)];
}
function genName(t,force){ // nombre mezclado para el equipo t cuando ya tiene sus 2 jugadores
  const d=modal.d,k=t?'lb':'la',o=t?'la':'lb';
  if(d.t[t].length<2){d[k]='';return}
  if(force||!d[k])d[k]=blend(pname(d.t[t][0]),pname(d.t[t][1]),[d[o],d[k]].filter(Boolean));
}
const allMatches=()=>[...S.league.matches,...S.league.pending];
function stats(){
  const P={},T={};
  S.league.players.forEach(p=>P[p.id]={id:p.id,name:p.name,pj:0,g:0,e:[0,0,0,0],o:[0,0,0]});
  allMatches().forEach(m=>{
    const by=m.d&&m.d.o&&m.d.o.by; // órdago: quién lo echó y si le salió bien
    if(by&&P[by]){P[by].o[0]++;if((m.a.includes(by)?0:1)===m.w)P[by].o[1]++}
    if(m.d&&Array.isArray(m.d.on))m.d.on.forEach(x=>{if(x&&P[x.by])P[x.by].o[2]++}); // órdagos no queridos
    [m.a,m.b].forEach((ids,t)=>{
    const win=m.w===t;
    const e=m.d&&m.d.e&&m.d.e[t];
    ids.forEach(id=>{if(P[id]){P[id].pj++;if(win)P[id].g++;if(e)e.forEach((v,i)=>P[id].e[i]+=v||0)}});
    const k=[...ids].sort((x,y)=>x-y).join('-'),o=T[k]||(T[k]={ids,pj:0,g:0,name:''});
    o.pj++;if(win)o.g++;o.name=t?m.nb:m.na;
  })});
  const ord=(x,y)=>y.g-x.g||y.g/(y.pj||1)-x.g/(x.pj||1)||x.pj-y.pj;
  return {players:Object.values(P).sort(ord),pairs:Object.values(T).sort(ord)};
}
// Balance de partidas entre las dos parejas de la partida en curso (mismos jugadores, da igual el nombre)
function h2h(m){
  const r=[0,0];if(!m||!m.league)return r;
  const key=ids=>[...ids].sort((x,y)=>x-y).join('-'),A=key(m.league.a),B=key(m.league.b);
  allMatches().forEach(x=>{const ka=key(x.a),kb=key(x.b);
    if(ka===A&&kb===B)r[x.w]++;else if(ka===B&&kb===A)r[1-x.w]++});
  return r;
}
function dropLocal(uid){const L=S.league;L.pending=L.pending.filter(x=>x.uid!==uid);L.matches=L.matches.filter(x=>x.uid!==uid);save()}

      const win=m.w===t,e=Array.isArray(d.e)&&Array.isArray(d.e[t])?d.e[t]:null,k=[...ids].sort((x,y)=>x-y).join('-'),o=T[k]||(T[k]={pj:0,g:0});

/* MMR: Elo por jugador. Todos empiezan en 1000; la pareja vale la media de sus dos jugadores.
   Esperado E = 1/(1+10^((Rrival-Rpropia)/400)); cambio = K · margen · (resultado − E).
   K = 40 en las 10 primeras partidas de cada uno (encuentra su nivel rápido) y 20 después.
   margen: ganar de paliza cuenta hasta un 50 % más (40-5 pesa más que 40-38).
   Se recalcula entero desde el historial: las partidas borradas o restauradas cuentan o no solas. */
const MMR0=1000,PROV=5;
let mmrMemo=null;
function mmrData(){
  const ms=allMatches().slice().sort((x,y)=>x.date-y.date||String(x.uid).localeCompare(String(y.uid)));
  const key=S.league.players.length+'|'+ms.map(m=>m.uid+m.w+m.ja+m.jb).join(',');
  if(mmrMemo&&mmrMemo.key===key)return mmrMemo;
  const R={},M={},get=id=>R[id]||(R[id]={r:MMR0,n:0,best:MMR0,last:0,hist:[MMR0]});
  S.league.players.forEach(p=>get(p.id));
  ms.forEach(m=>{
    if(!m.a||!m.b||m.a.length!==2||m.b.length!==2)return;
    const ra=(get(m.a[0]).r+get(m.a[1]).r)/2,rb=(get(m.b[0]).r+get(m.b[1]).r)/2;
    const ea=1/(1+Math.pow(10,(rb-ra)/400)),sa=m.w?0:1;
    const hi=Math.max(m.ja||0,m.jb||0,1),mg=1+.5*Math.min(1,Math.abs((m.ja||0)-(m.jb||0))/hi);
    const ds=[0,0];
    [[m.a,sa-ea],[m.b,(1-sa)-(1-ea)]].forEach(([ids,x],t)=>ids.forEach(id=>{const p=get(id),d=(p.n<10?40:20)*mg*x;
      p.r+=d;p.n++;p.last=d;p.best=Math.max(p.best,p.r);p.hist.push(p.r);ds[t]+=d/2}));
    M[m.uid]={da:ds[0],db:ds[1],pa:Math.round(100*ea)};
  });
  return mmrMemo={key,R,M};
}

  if(ld&&ld.g>0){const side=ids.indexOf(ld.id),
    rv=(side>=0?(side<2?B:A):ids).map(id=>P[id]).filter(r=>r&&r.id!==ld.id&&r.g+1>=ld.g).map(r=>esc(r.name));
    if(rv.length)st.push(side>=0?`${esc(ld.name)} se juega el liderato: si pierde, ${rv.join(' y ')} le alcanza${rv.length>1?'n':''}`
      :`${rv.join(' y ')} puede${rv.length>1?'n':''} alcanzar al líder ${esc(ld.name)} si gana${rv.length>1?'n':''}`)}
  return `<div class="fc"><div class="fh"><b>Pronóstico</b><small>según MMR: ${Math.round(rA)} vs ${Math.round(rB)}</small></div>
    <div class="fp"><span class="a">${pA}%</span><span class="b">${pB}%</span></div><div class="fgb"><i style="width:${pA}%"></i></div>
    <div class="fl">Entre estas parejas: <b>${h[0]}–${h[1]}</b></div>${tr(kA,A)}${tr(kB,B)}
    ${st.slice(0,4).map(t=>`<div class="fl">• ${t}</div>`).join('')}</div>`;
}

/* ───────── Partida en directo ─────────
   El móvil que lleva la partida emite cada cambio por un canal de Supabase Realtime (broadcast: no se guarda nada
   en la base de datos). Quien tenga el código (o el enlace #ver=CÓDIGO) la ve en solo lectura, sin necesidad de
   estar en la liga. Un solo WebSocket: o se emite o se mira. El estado va entero en cada mensaje, así el que llega
   tarde o se reconecta lo tiene al momento (además pide "hi" al entrar y el emisor contesta). */
const RT={ws:null,want:null,ok:false,ref:0,hb:0,retry:0,rt:0};
const rtTopic=c=>'realtime:musete-'+c;
function rtPush(ev,payload){const w=RT.ws;if(!w||w.readyState!==1||!RT.want)return;
  w.send(JSON.stringify({topic:rtTopic(RT.want.code),event:ev,payload,ref:String(++RT.ref),join_ref:'1'}))}
const rtCast=(ev,p)=>{if(RT.ok)rtPush('broadcast',{type:'broadcast',event:ev,payload:p})};
function rtConn(){const w=RT.want;if(!w||RT.ws)return;
  let ws;try{ws=new WebSocket(SB_URL.replace(/^http/,'ws')+'/realtime/v1/websocket?apikey='+encodeURIComponent(SB_KEY)+'&vsn=1.0.0')}catch(e){return}
  RT.ws=ws;RT.ok=false;
  ws.onopen=()=>{if(RT.ws!==ws)return;rtPush('phx_join',{config:{broadcast:{self:false,ack:false},presence:{key:''},postgres_changes:[],private:false}});
    clearInterval(RT.hb);RT.hb=setInterval(()=>{if(ws.readyState===1)ws.send(JSON.stringify({topic:'phoenix',event:'heartbeat',payload:{},ref:String(++RT.ref)}))},25000)};
  ws.onmessage=e=>{if(RT.ws!==ws)return;let j;try{j=JSON.parse(e.data)}catch(_){return}
    if(!j||j.topic!==rtTopic(w.code))return;
    if(j.event==='phx_reply'&&j.ref==='1'&&!RT.ok){RT.ok=j.payload&&j.payload.status==='ok';RT.retry=0;w.on(RT.ok?'_open':'_err');return}
    if(j.event==='broadcast'&&j.payload)w.on(j.payload.event,j.payload.payload)};
  ws.onclose=()=>{clearInterval(RT.hb);if(RT.ws!==ws)return;RT.ws=null;RT.ok=false;
    if(RT.want===w){w.on('_close');clearTimeout(RT.rt);RT.rt=setTimeout(rtConn,Math.min(15000,1000*2**RT.retry++))}};
  ws.onerror=()=>{try{ws.close()}catch(_){}};
}
function rtOpen(role,code,on){if(RT.want&&RT.want.role===role&&RT.want.code===code)return;rtClose();RT.want={role,code,on};RT.retry=0;rtConn()}
function rtClose(){const ws=RT.ws;RT.want=null;RT.ws=null;RT.ok=false;clearInterval(RT.hb);clearTimeout(RT.rt);if(ws)try{ws.close()}catch(_){}}
// al volver a primer plano (los móviles cortan el socket en segundo plano) se reconecta enseguida
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&RT.want&&!RT.ws){RT.retry=0;rtConn()}});

/* Audio: el emisor abre el micro y crea una conexión WebRTC por cada espectador que pide escuchar ("ask").
   Oferta y respuesta viajan por el canal (sin trickle: se espera a reunir los candidatos ICE). Solo STUN público:
   en alguna red móvil muy cerrada puede no conectar. Máx. 10 oyentes. */
const ICE={iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]};
const iceDone=pc=>new Promise(r=>{if(pc.iceGatheringState==='complete')return r();const t=setTimeout(r,2500);
  pc.addEventListener('icegatheringstatechange',()=>{if(pc.iceGatheringState==='complete'){clearTimeout(t);r()}})});
let lvMic=null;const lvPcs={};
const micN=()=>Object.values(lvPcs).filter(pc=>pc.connectionState==='connected').length;
function pcDrop(id){const pc=lvPcs[id];delete lvPcs[id];if(pc)try{pc.close()}catch(_){}}
async function micOn(){if(window.MuseteNative){toast('En la app no hay permiso de micro: abre Musete en el navegador para emitir audio');return}
  if(!navigator.mediaDevices||!window.RTCPeerConnection){toast('Este móvil no deja usar el micro aquí');return}
  try{lvMic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false})}
  catch(e){lvMic=null;toast('Sin permiso para usar el micro')}}
function micOff(){Object.keys(lvPcs).forEach(pcDrop);if(lvMic){lvMic.getTracks().forEach(t=>t.stop());lvMic=null}}
async function micOffer(id){if(!lvMic||typeof id!=='string'||!/^[a-z0-9]{6,16}$/.test(id))return;pcDrop(id);if(Object.keys(lvPcs).length>=10)return;
  const pc=new RTCPeerConnection(ICE);lvPcs[id]=pc;lvMic.getTracks().forEach(t=>pc.addTrack(t,lvMic));
  pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState)&&lvPcs[id]===pc)pcDrop(id);if(modal&&modal.type==='live')soft()};
  try{await pc.setLocalDescription(await pc.createOffer());await iceDone(pc);if(lvPcs[id]===pc)rtCast('sdp',{to:id,d:pc.localDescription.sdp})}catch(e){pcDrop(id)}}
async function micAns(p){const pc=p&&lvPcs[p.from];if(!pc||typeof p.d!=='string')return;
  try{await pc.setRemoteDescription({type:'answer',sdp:p.d})}catch(e){pcDrop(p.from)}}
// Espectador: escucha solo tras tocar el altavoz (los navegadores no dejan sonar sin un toque)
const lvMe=Math.random().toString(36).slice(2,12);
let vpc=null,lvAud=false,lvAudT=0;
const lvEl=()=>{let a=document.getElementById('lvaudio');if(!a){a=document.createElement('audio');a.id='lvaudio';a.autoplay=true;a.setAttribute('playsinline','');document.body.appendChild(a)}return a};
function audStop(){lvAud=false;clearTimeout(lvAudT);if(vpc)try{vpc.close()}catch(_){}vpc=null;const a=document.getElementById('lvaudio');if(a){a.pause();a.srcObject=null}}
const audAsk=()=>{if(lvAud&&RT.ok)rtCast('ask',{id:lvMe})};
async function audOffer(p){if(!lvAud||!p||p.to!==lvMe||typeof p.d!=='string')return;
  if(vpc)try{vpc.close()}catch(_){}
  const pc=vpc=new RTCPeerConnection(ICE);
  pc.ontrack=e=>{const a=lvEl();a.srcObject=e.streams[0]||new MediaStream([e.track]);a.play().catch(()=>toast('Toca el altavoz para oír la mesa'));toast('Escuchando la mesa')};
  pc.onconnectionstatechange=()=>{if(vpc!==pc)return;if(pc.connectionState==='failed'){toast('No se pudo conectar el audio. Reintentando…');clearTimeout(lvAudT);lvAudT=setTimeout(audAsk,4000)}};
  try{await pc.setRemoteDescription({type:'offer',sdp:p.d});await pc.setLocalDescription(await pc.createAnswer());await iceDone(pc);
    if(vpc===pc)rtCast('ans',{from:lvMe,d:pc.localDescription.sdp})}catch(e){toast('No se pudo conectar el audio')}}

const LVA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const lvCode=()=>{const r=new Uint8Array(5);crypto.getRandomValues(r);return [...r].map(x=>LVA[x%LVA.length]).join('')};

let lvLast='',lvT=0,lvBeat=0;
function lvSnap(){const m=S.mus,l=m.log||[],x=l[l.length-1],w=modal&&modal.type==='win'?{t:modal.t,pa:modal.pa,pb:modal.pb,o:modal.o?1:0}:null;

function lvSend(force){if(!RT.ok||!S.mus||!S.mus.live)return;const j=JSON.stringify(lvSnap());if(!force&&j===lvLast)return;lvLast=j;rtCast('s',JSON.parse(j))}
const lvTx=(ev,p)=>{if(ev==='ask')micOffer(p&&p.id);if(ev==='ans')micAns(p);if(ev==='_open'||ev==='hi')lvSend(true);if(ev==='_open'||ev==='_close'||ev==='_err')soft()};

// Espectador
const lv={code:'',s:null,st:'conn',sw:0,dt:null};
const lvRx=(ev,p)=>{
  if(ev==='_open'){lv.st='ok';rtCast('hi',{});audAsk();soft();return}
  if(ev==='sdp'){audOffer(p);return}
  if(ev==='_close'||ev==='_err'){if(lv.st!=='end')lv.st='off';soft();return}
  if(ev==='end'){lv.st='end';soft();return}
  if(ev!=='s'||!p||typeof p!=='object')return;
  const ok=typeof p.a==='string'&&typeof p.b==='string'&&Number.isFinite(p.pa)&&Number.isFinite(p.pb)&&Array.isArray(p.env)&&p.env.length===4;if(!ok)return;
  const nx=p.x&&p.x.dt,prev=lv.s,chg=prev&&(prev.pa!==p.pa?0:prev.pb!==p.pb?1:-1);
  lv.s=p;lv.st='ok';
  if(lvAud&&p.mic&&!(prev&&prev.mic))audAsk(); // el micro se ha vuelto a encender
  if(!p.mic&&vpc){try{vpc.close()}catch(_){}vpc=null}
  soft();
  if(nx!=null&&nx!==lv.dt){lv.dt=nx;requestAnimationFrame(()=>{
    const pop=el=>{if(!el)return;el.classList.remove('lvpop');void el.offsetWidth;el.classList.add('lvpop')};

};
const verCode=()=>{const h=location.hash.slice(1),m=h.match(/^ver=?([A-Za-z0-9]{4,8})$/);return m?m[1].toUpperCase():''};
function vVer(){const c=verCode(),s=lv.s;
  if(s&&lv.code===c){const m={a:s.a,b:s.b,pa:s.pa,pb:s.pb,env:s.env,ses:Array.isArray(s.ses)?s.ses:[0,0],sw:lv.sw};

    <p class="hint">Si tarda, comprueba el código: el móvil que lleva la partida tiene que estar emitiendo (botón de la antena).</p></section>`;

// Quién habla por el socket: en #ver se mira; si no, se emite si la partida tiene código de directo
function liveSync(){const c=verCode();
  if(c){if(lv.code!==c){lv.code=c;lv.s=null;lv.st='conn';lv.dt=null}rtOpen('rx',c,lvRx);return}
  if(lv.code||lvAud)audStop();

  if(m&&m.live){rtOpen('tx',m.live,lvTx);clearTimeout(lvT);lvT=setTimeout(()=>lvSend(),80);

  if(RT.want&&RT.want.role==='tx'){rtCast('end',{});const w=RT.ws;RT.ws=null;RT.want=null;RT.ok=false;clearInterval(RT.hb);clearTimeout(RT.rt);if(w)setTimeout(()=>{try{w.close()}catch(_){}},300)}

function mRow(m){
  const fmt=ts=>new Date(ts).toLocaleDateString('es-ES',{day:'numeric',month:'short'});
  return `<div class="match" data-a="mdet" data-p="${esc(m.uid)}"><span class="d">${fmt(m.date)}</span>
      <span class="mt"><b class="${m.w?'':'w'}">${esc(m.na)}</b> ${m.ja}–${m.jb} <b class="${m.w?'w':''}">${esc(m.nb)}</b>${(x=>x?`<i class="og mmrd">${sgn(m.w?x.db:x.da)} MMR</i>`:'')(mmrData().M[m.uid])}${m.d&&m.d.o?`<i class="og">órdago de ${esc(pname(m.d.o.by))}</i>`:''}${mtags(m).map(t=>`<i class="tg">${t}</i>`).join('')}${S.league.pending.includes(m)?'<small>pendiente de subir</small>':''}</span>
      <button class="ic" data-a="askDelM" data-p="${esc(m.uid)}" aria-label="Borrar partida">✕</button></div>`;
}

/* Todas las partidas, con filtro: 1 jugador marcado → sus partidas; 2 → las que jugaron juntos de pareja.
   El filtro vive en memoria: se mantiene al abrir el detalle de una partida y volver. */
const mf={p:[],open:null,pp:[]};
function vMatches(){
  const L=S.league,sel=mf.p,all=allMatches().reverse();
  const team=(m,id)=>m.a.includes(id)?0:m.b.includes(id)?1:-1;
  const ms=sel.length===2?all.filter(m=>{const t=team(m,sel[0]);return t>=0&&t===team(m,sel[1])})
    :sel.length===1?all.filter(m=>team(m,sel[0])>=0):all;
  // Balance del filtro: victorias del jugador o de la pareja
  let rec=`<p class="mrec">${ms.length} partidas</p>`;
  if(sel.length){const g=ms.filter(m=>team(m,sel[0])===m.w).length;
    rec=`<p class="mrec"><b>${sel.map(pname).map(esc).join(' + ')}</b> · ${ms.length} ${ms.length===1?'partida':'partidas'} · ${g} G · ${ms.length-g} P${ms.length?` · ${Math.round(100*g/ms.length)}%`:''}</p>`}
  const pairs=stats().pairs.slice().sort((x,y)=>y.pj-x.pj).slice(0,8);
  const played=L.players.filter(p=>all.some(m=>team(m,p.id)>=0));
  const names=ids=>ids.map(pname).map(esc).join(' + ');
  // Desplegable abierto: Jugador (un toque filtra) o Pareja (habituales, o dos toques en cualquier jugador)
  const panel=mf.open==='p'
    ?`<div class="fpanel">${played.map(p=>`<button class="qp ${sel.length===1&&sel[0]===p.id?'on':''}" data-a="mfP" data-p="${p.id}">${esc(p.name)}</button>`).join('')}</div>`
    :mf.open==='pair'
    ?`<div class="fpanel">${pairs.length?`<small>Habituales</small>${pairs.map(o=>`<button class="qp ${sel.length===2&&o.ids.every(i=>sel.includes(i))?'on':''}" data-a="mfPair" data-p="${o.ids.join(',')}">${names(o.ids)}</button>`).join('')}`:''}
      <small>${mf.pp.length?`${names(mf.pp)} + …`:'O elige dos jugadores'}</small>${played.map(p=>`<button class="qp ${mf.pp.includes(p.id)?'on':''}" data-a="mfP2" data-p="${p.id}">${esc(p.name)}</button>`).join('')}</div>`:'';
  return `<div class="fbar">${bar('Todas las partidas')}
    <div class="frow">
      <button class="fbtn ${mf.open==='p'?'open':''} ${sel.length===1?'on':''}" data-a="mfOpen" data-p="p">${sel.length===1?names(sel):'Jugador'} <i>▾</i></button>
      <button class="fbtn ${mf.open==='pair'?'open':''} ${sel.length===2?'on':''}" data-a="mfOpen" data-p="pair">${sel.length===2?names(sel):'Pareja'} <i>▾</i></button>
      ${sel.length?`<button class="ic fx" data-a="mfClear" aria-label="Quitar filtro">✕</button>`:''}
    </div>${panel}</div>
  <section class="card">${rec}
    ${ms.length?ms.map(mRow).join(''):`<p class="hint">${sel.length===2?'No han jugado juntos de pareja. ¿Rivalidad eterna?':'No hay partidas.'}</p>`}
  </section>`;
}
function mmrCard(){
  const R=mmrData().R,ps=S.league.players.map(p=>({id:p.id,name:p.name,...(R[p.id]||{r:MMR0,n:0,last:0})})).filter(o=>o.n);
  if(!ps.length)return '';
  ps.sort((x,y)=>(x.n<PROV)-(y.n<PROV)||y.r-x.r);
  return `<section class="card"><h3>MMR</h3>
    <div class="tr th"><span></span><span></span><span>PJ</span><span></span><span>Últ.</span><span>MMR</span></div>
    ${ps.map((o,i)=>`<div class="tr pl" data-a="pdet" data-p="${o.id}"><span class="pos">${o.n<PROV?'·':i+1}</span><span class="nm">${esc(o.name)}${o.n<PROV?`<small>provisional (${o.n} de ${PROV} partidas)</small>`:''}</span><span>${o.n}</span><span></span><span class="${o.last>=0?'up':'dn'}">${sgn(o.last)}</span><span class="g">${Math.round(o.r)}</span></div>`).join('')}
    <p class="rec">Empieza en ${MMR0}. Ganar a quien tiene más MMR sube mucho; perder con quien tiene menos baja mucho. Las palizas cuentan más.</p>
  </section>`;
}
/* Tarjetas de la liga: cada una se pliega y se ordena a gusto (se guarda en este móvil) */
/* Tarjetas extra (cada una se registra en XCARDS) */
const XCARDS=[];
/* ── tarjeta bat ── */
// Batacazos: victorias más improbables según el MMR (probabilidad previa del ganador < 45 %)
function card_bat(){
  const M=mmrData().M,fmt=ts=>new Date(ts).toLocaleDateString('es-ES',{day:'numeric',month:'short'});
  const ids=x=>Array.isArray(x)?x:[];
  const L=allMatches().map(m=>{const x=M[m.uid];if(!x||typeof x.pa!=='number')return null;
    const w=m.w?1:0,p=w?100-x.pa:x.pa;return {m,w,p,g:w?x.db:x.da}}).filter(o=>o&&o.p<45)
    .sort((x,y)=>x.p-y.p||y.g-x.g||y.m.date-x.m.date).slice(0,5);
  if(!L.length)return '';
  const pr=o=>{const t=ids(o.w?o.m.b:o.m.a).map(pname).join(' + ');return t||(o.w?o.m.nb:o.m.na)||'¿?'};
  const sc=o=>o.w?`${o.m.jb??'?'}–${o.m.ja??'?'}`:`${o.m.ja??'?'}–${o.m.jb??'?'}`;
  return `<div class="tr th"><span></span><span class="xbat-nm">Contra pronóstico</span><span>Opc.</span><span>MMR</span></div>
    ${L.map((o,i)=>`<div class="tr pl" data-a="mdet" data-p="${esc(o.m.uid)}"><span class="pos">${i+1}</span><span class="nm xbat-nm">${esc(pr(o))}<small>${o.m.date?fmt(o.m.date)+' · ':''}${sc(o)} · ganaron con un ${o.p} %</small></span><span class="g">${o.p}%</span><span class="up">${sgn(o.g)}</span></div>`).join('')}
    <p class="rec">La calculadora decía que no. El mus dijo que se la metieran donde les quepa.</p>`;
}
XCARDS.push({k:'bat',t:'Batacazos',f:card_bat});
/* ── tarjeta qui ── */
// Química: por pareja (≥3 partidas juntos), victorias reales menos las esperadas por el MMR
function card_qui(){
  const M=mmrData().M,T={};
  allMatches().forEach(m=>{const x=M[m.uid];if(!x||typeof x.pa!=='number')return;
    [[m.a,x.pa/100,0],[m.b,1-x.pa/100,1]].forEach(([ids,e,s])=>{
      if(!Array.isArray(ids)||ids.length!==2)return;
      const k=[...ids].sort((p,q)=>p-q||String(p).localeCompare(String(q))).join(','),o=T[k]||(T[k]={ids:[...ids].sort((p,q)=>p-q||String(p).localeCompare(String(q))),pj:0,g:0,e:0});
      o.pj++;o.e+=e;if((m.w?1:0)===s)o.g++})});
  const L=Object.values(T).filter(o=>o.pj>=3).map(o=>(o.d=Math.round(10*(o.g-o.e))/10,o)).sort((x,y)=>y.d-x.d||y.pj-x.pj);
  if(!L.length)return '';
  const f1=v=>v.toFixed(1).replace('.',','),df=v=>(v>0?'+':v<0?'−':'±')+f1(Math.abs(v));
  const row=(o,i)=>`<div class="tr"><span class="pos">${i+1}</span><span class="nm">${esc(pname(o.ids[0]))}<small>+ ${esc(pname(o.ids[1]))}</small></span><span>${o.pj}</span><span class="g">${o.g}</span><span>${f1(o.e)}</span><span class="${o.d>0?'up':o.d<0?'dn':''}">${df(o.d)}</span></div>`;
  const up=L.filter(o=>o.d>0),dn=L.filter(o=>o.d<=0);
  return `<div class="tr th"><span></span><span></span><span>PJ</span><span>G</span><span>Esp</span><span>Dif</span></div>
    ${up.length?`<p class="xqui-lb">Almas gemelas</p>${up.map(row).join('')}`:''}
    ${dn.length?`<p class="xqui-lb dn">Se estorban</p>${dn.map((o,i)=>row(o,up.length+i)).join('')}`:''}
    <p class="rec">Victorias de verdad menos las que el MMR les daba juntos: en positivo se entienden con un guiño; en negativo, mejor divorcio amistoso.</p>`;
}
XCARDS.push({k:'qui',t:'Química',f:card_qui});
/* ── tarjeta evo ── */
/* Evolución MMR: una línea por jugador, partida a partida de la liga (mismo orden y mismo filtro que mmrData).
   Por defecto se resalta el podio (top 3 por MMR actual) y el resto va en gris. Los chips resaltan a quien toques
   (evoSel, solo en memoria). Delegación propia con data-evo porque A se define después de este bloque. */
let evoSel=[];
const EVO_C=['var(--a)','var(--b)','var(--warn)','var(--ok)','var(--danger)','var(--accent)'];
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-evo]');if(!b||b.disabled)return;
  const v=b.dataset.evo;
  if(v==='')evoSel=[];
  else{const i=evoSel.indexOf(v);if(i>=0)evoSel.splice(i,1);else{evoSel.push(v);if(evoSel.length>EVO_C.length)evoSel.shift()}}
  render();
});
function card_evo(){
  const ms=allMatches().slice().sort((x,y)=>x.date-y.date||String(x.uid).localeCompare(String(y.uid)))
    .filter(m=>m.a&&m.b&&m.a.length===2&&m.b.length===2);
  if(ms.length<2)return '';
  const R=mmrData().R,XS={},N=ms.length;
  ms.forEach((m,i)=>[...m.a,...m.b].forEach(id=>(XS[id]=XS[id]||[0]).push(i+1)));
  const ps=S.league.players.map(p=>({id:p.id,k:String(p.id),name:p.name,o:R[p.id],x:XS[p.id]}))
    .filter(p=>p.o&&p.o.n&&p.x&&p.x.length===p.o.hist.length).sort((x,y)=>(x.o.n<PROV)-(y.o.n<PROV)||y.o.r-x.o.r);
  if(!ps.length)return '';
  evoSel=evoSel.filter(k=>ps.some(p=>p.k===k));
  const hiK=evoSel.length?evoSel:ps.slice(0,3).map(p=>p.k),col=k=>hiK.indexOf(k);
  // eje Y: escalón "bonito" que divide 1000, así la referencia cae en una línea de la rejilla
  const all=ps.flatMap(p=>p.o.hist);let lo=Math.min(MMR0,...all),hi=Math.max(MMR0,...all);
  const st=[25,50,100,200,400].find(s=>(Math.ceil(hi/s)-Math.floor(lo/s))<=5)||500;
  lo=Math.floor(lo/st)*st;hi=Math.ceil(hi/st)*st;if(hi===lo)hi+=st;
  const x0=32,x1=294,y0=8,y1=140,X=i=>(x0+(x1-x0)*i/N).toFixed(1),Y=v=>(y1-(y1-y0)*(v-lo)/(hi-lo)).toFixed(1);
  let gr='';for(let v=lo;v<=hi;v+=st)if(v!==MMR0)gr+=`<line class="gr" x1="${x0}" x2="${x1}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${x0-4}" y="${+Y(v)+3}" text-anchor="end">${v}</text>`;
  gr+=`<line class="xevo-ref" x1="${x0}" x2="${x1}" y1="${Y(MMR0)}" y2="${Y(MMR0)}"/><text class="xevo-rt" x="${x0-4}" y="${+Y(MMR0)+3}" text-anchor="end">${MMR0}</text>`;
  const xt=[...new Set([1,Math.round(N/2),N])].filter(i=>i>=1);
  gr+=xt.map(i=>`<text x="${X(i)}" y="${y1+12}" text-anchor="middle">${i}</text>`).join('');
  const pts=p=>{const a=p.o.hist.map((v,j)=>X(p.x[j])+','+Y(v));if(p.x[p.x.length-1]<N)a.push(X(N)+','+Y(p.o.r));return a.join(' ')};
  const sty=k=>{const c=col(k);return `stroke:${EVO_C[c]};${c>=3?'stroke-dasharray:6 3;':''}`};
  const gray=ps.filter(p=>col(p.k)<0).map(p=>`<polyline class="xevo-g" points="${pts(p)}"/>`).join('');
  const hot=ps.filter(p=>col(p.k)>=0).sort((x,y)=>col(y.k)-col(x.k)).map(p=>`<polyline class="xevo-h" style="${sty(p.k)}" points="${pts(p)}"/><circle class="xevo-d" style="fill:${EVO_C[col(p.k)]}" cx="${X(N)}" cy="${Y(p.o.r)}" r="3"/>`).join('');
  const ex=p=>{let mx=0,mn=0;p.o.hist.forEach((v,j)=>{if(v>p.o.hist[mx])mx=j;if(v<p.o.hist[mn])mn=j});return{mx:Math.round(p.o.hist[mx]),mn:Math.round(p.o.hist[mn])}};
  const dot=k=>col(k)>=0?`<i class="xevo-dot" style="background:${EVO_C[col(k)]}"></i>`:'';
  return `<svg class="ch xevo-ch" viewBox="0 0 300 156" role="img" aria-label="Evolución del MMR en ${N} partidas. Resaltados: ${esc(hiK.map(k=>ps.find(p=>p.k===k).name).join(', '))}">${gr}${gray}${hot}</svg>
    <div class="xevo-chips" role="group" aria-label="Resaltar jugadores">${ps.map(p=>`<button class="qp xevo-chip ${evoSel.includes(p.k)?'on':''}" data-evo="${esc(p.k)}" aria-pressed="${evoSel.includes(p.k)}">${dot(p.k)}${esc(p.name)}</button>`).join('')}${evoSel.length?`<button class="qp xevo-chip" data-evo="">Ver podio</button>`:''}</div>
    <div class="tr th xevo-tr"><span></span><span></span><span>PJ</span><span>Máx</span><span>Mín</span><span>MMR</span></div>
    ${ps.map((p,i)=>{const e=ex(p);return `<div class="tr pl xevo-tr" data-a="pdet" data-p="${p.id}"><span class="pos">${p.o.n<PROV?"·":i+1}</span><span class="nm">${dot(p.k)}${esc(p.name)}</span><span>${p.o.n}</span><span class="up">${e.mx}</span><span class="dn">${e.mn}</span><span class="g">${Math.round(p.o.r)}</span></div>`}).join('')}
    <p class="rec">Eje: nº de partida de la liga. La raya de ${MMR0} es la casilla de salida: quien vive debajo, que invite a la ronda. ${evoSel.length?'Toca otra vez para quitarlo.':'Sin tocar nada sale el podio; toca un nombre para sacarle los colores.'}</p>`;
}
XCARDS.push({k:'evo',t:'Evolución MMR',f:card_evo});
/* ── tarjeta cla ── */
/* Clásicos: pareja contra pareja (cada pareja = ids ordenados) repetido 3 veces o más.
   Nombre de la rivalidad determinista por hash de los ids. ±1 = "a cara de perro". Toca → la última que jugaron. */
const CLA_N=['El Clásico del Bar','Derbi de la Grande','La Guerra del Órdago','El Duelo de los Duples','Clásico de la Chica',
  'La Batalla del Tapete','Derbi del Carajillo','La Final de la Barra','La Vendetta de los Pares','El Clásico de las Señas Prohibidas',
  'Derbi de la 31','El Odio Cordial','La Guerra Fría del Envido','El Pique Eterno','Derbi del Pacharán'];
function card_cla(){
  const G={},srt=ids=>[...ids].sort((x,y)=>x-y);
  allMatches().forEach(m=>{
    if(!m.a||!m.b||m.a.length!==2||m.b.length!==2||(m.w!==0&&m.w!==1))return;
    const a=srt(m.a),b=srt(m.b),ka=a.join('-'),kb=b.join('-');if(ka===kb)return;
    const sw=ka>kb,key=sw?kb+'|'+ka:ka+'|'+kb,o=G[key]||(G[key]={key,p:sw?[b,a]:[a,b],w:[0,0],n:0,last:null});
    o.n++;o.w[sw?1-m.w:m.w]++;if(!o.last||m.date>=o.last.date)o.last=m;
  });
  const L=Object.values(G).filter(o=>o.n>=3).sort((x,y)=>y.n-x.n||Math.abs(x.w[0]-x.w[1])-Math.abs(y.w[0]-y.w[1])||y.last.date-x.last.date);
  if(!L.length)return '';
  const hash=s=>{let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};
  const nm=ids=>ids.map(id=>esc(pname(id))).join('+'),fmt=ts=>new Date(ts).toLocaleDateString('es-ES',{day:'numeric',month:'short'});
  const used=new Set(),tag=k=>{let i=hash(k)%CLA_N.length;while(used.has(i)&&used.size<CLA_N.length)i=(i+1)%CLA_N.length;used.add(i);return CLA_N[i]};
  return L.map(o=>{
    const f=o.w[1]>o.w[0]?1:0,g=1-f,perro=Math.abs(o.w[0]-o.w[1])<=1;
    return `<div class="xcla-it" data-a="mdet" data-p="${esc(o.last.uid)}">
      <div class="xcla-tx"><div class="xcla-tag">${tag(o.key)}${perro?'<i class="xcla-perro">a cara de perro</i>':''}</div>
        <div class="xcla-vs"><b>${nm(o.p[f])}</b> <small>vs</small> <b>${nm(o.p[g])}</b></div>
        <small class="xcla-sub">${o.n} partidas · última ${fmt(o.last.date)}</small></div>
      <div class="xcla-sc">${o.w[f]}–${o.w[g]}</div></div>`}).join('')+
    `<p class="rec">Misma pareja contra misma pareja, 3 veces o más. El que va delante, a la izquierda; el de la derecha, que pida la revancha. Toca para ver la última.</p>`;
}
XCARDS.push({k:'cla',t:'Clásicos',f:card_cla});
/* ── tarjeta rec ── */
/* Récords: salón de la fama de la liga. Cada fila es el récord absoluto de todas las partidas y se toca para ver la partida.
   Tolera partidas viejas sin d, sin d.g (serie del marcador) o sin d.t (duración): esos récords salen solo con las que los tienen.
   Empates: se queda la primera que lo consiguió (el récord es de quien llegó antes). */
function recData(){
  const ms=allMatches().filter(m=>m&&m.a&&m.b&&Number.isFinite(+m.ja)&&Number.isFinite(+m.jb)).slice().sort((x,y)=>x.date-y.date);
  const R={n:ms.length},top=(k,m,v,x)=>{if(v==null||!Number.isFinite(v))return;const c=R[k];if(!c||v>c.v)R[k]={m,v,...x}};
  const day={};
  ms.forEach(m=>{
    const d=m.d||{},ja=+m.ja,jb=+m.jb,df=Math.abs(ja-jb),lt=m.w?0:1; // lt = pareja que perdió
    top('pal',m,df);
    top('igu',m,-df);
    // serie del marcador: [a0,b0,a1,b1,…]; un órdago querido cierra la partida con un salto a 40 que no son puntos jugados
    const g=Array.isArray(d.g)&&d.g.length>=4?d.g.map(v=>+v||0):null;
    if(g){
      let rem=0,pf=null,run=[0,0],rb=null;
      const n=g.length/2|0,last=d.o&&d.o.by?n-1:n;
      for(let i=0;i<n;i++){
        const p=[g[2*i],g[2*i+1]],le=p[lt]-p[1-lt]; // ventaja de quien acabó perdiendo
        if(le>rem)rem=le;
        if(le>0&&p[lt]>=30&&(!pf||le>pf.le||(le===pf.le&&p[lt]>pf.s)))pf={le,s:p[lt],at:p.slice()};
        if(i>0&&i<last){
          const da=p[0]-g[2*i-2],db=p[1]-g[2*i-1];
          if(da>0&&db<=0){run[0]+=da;if(db<0)run[1]=Math.max(0,run[1]+db);else run[1]=0}
          else if(db>0&&da<=0){run[1]+=db;if(da<0)run[0]=Math.max(0,run[0]+da);else run[0]=0}
          else if(da>0&&db>0)run=[0,0]; // serie resumida: no se sabe quién anotó antes
          else{if(da<0)run[0]=Math.max(0,run[0]+da);if(db<0)run[1]=Math.max(0,run[1]+db)}
          [0,1].forEach(t=>{if(run[t]>0&&(!rb||run[t]>rb.v))rb={v:run[t],t}});
        }
      }
      if(rem>0)top('rem',m,rem);
      if(pf)top('pf',m,pf.le+pf.s/100,{le:pf.le,at:pf.at});
      if(rb)top('rac',m,rb.v,{t:rb.t});
    }
    if(typeof d.t==='number'&&d.t>=60){top('lar',m,d.t);top('cor',m,-d.t)}
    const o=d.o;
    if(o&&o.by&&Number.isFinite(+o.pa)&&Number.isFinite(+o.pb)){
      const pa=+o.pa,pb=+o.pb;top('ago',m,pa+pb+Math.min(pa,pb)/100,{pa,pb})} // más puntos en la mesa; desempata el que iba por detrás
    const dt=new Date(m.date);
    if(!isNaN(dt)){const k=dt.getFullYear()+'-'+dt.getMonth()+'-'+dt.getDate();(day[k]||(day[k]=[])).push(m)}
  });
  Object.values(day).forEach(l=>{if(l.length>=2)top('dia',l[l.length-1],l.length,{first:l[0]})});
  return R;
}
function card_rec(){
  const R=recData();if(R.n<2)return '';

// Puntos que lleva cada equipo por lance en la partida en curso: [equipo][grande, chica, pares, juego]
const lances=m=>m.hist||(m.hist=[[0,0,0,0],[0,0,0,0]]);
// Historial de movimientos de la partida en curso (solo en este móvil; se vacía al empezar otra)
// dt = segundos desde el inicio de la partida (el primer movimiento, envite incluido, pone el reloj en marcha)
const tSec=m=>{if(!m.t0)m.t0=Date.now();return Math.round((Date.now()-m.t0)/1000)};
const logMove=(m,x)=>{const l=m.log||(m.log=[]);l.push({...x,pa:m.pa,pb:m.pb,dt:tSec(m)});if(l.length>400)l.shift()};
// Subir/bajar un envite (k:'e', v = lo que queda en juego). Toques seguidos en el mismo lance (<3 s, o mantener pulsado) se funden en una entrada
const logEnv=(m,i)=>{const l=m.log||[],z=l[l.length-1],dt=tSec(m);if(z&&z.k==='e'&&z.i===i&&dt-(z.dt||0)<=3){z.v=m.env[i];z.dt=dt}else logMove(m,{k:'e',i,v:m.env[i]})};
/* Secuencia compacta para la liga en d.l, en TEXTO: el servidor limita detail a <4000 bytes de jsonb y ahí cada número
   ocupa ~12 bytes (un array de arrays no cabe). Entradas separadas por ';': k t i v,Δ
   k = p(punto) b(bonus) g(envite cobrado) n(órdago no querido) e(envite subido/bajado) o(fin por órdago); t = equipo 0/1 o '-';
   i = lance/bonus 0-9 o '-'; v = puntos (con signo; en 'e' lo que queda en juego); Δ = segundos desde la entrada anterior
   (la primera, desde el inicio). Ej.: "e-02,15;g013,40;p0-1,2" */
const packLog=l=>{let p=0;return l.map(x=>{const dt=x.dt||0,s=`${x.k}${x.t===0||x.t===1?x.t:'-'}${Number.isInteger(x.i)&&x.i>=0&&x.i<10?x.i:'-'}${Math.round(x.v??x.n??0)},${Math.max(0,dt-p)}`;p=dt;return s}).join(';')};
// d.l → [[k,t,i,v,dt],…] con dt absoluto (t/i = -1 si no aplica); [] si no hay o está mal
const unLog=d=>{const s=d&&typeof d.l==='string'?d.l:'';let p=0;if(!s)return [];
  return s.split(';').map(e=>{const m=e.match(/^([a-z])([01-])([0-9-])(-?\d+),(\d+)$/);if(!m)return null;p+=+m[5];return [m[1],m[2]==='-'?-1:+m[2],m[3]==='-'?-1:+m[3],+m[4],p]}).filter(Boolean)};
// Tamaño aproximado (por lo alto) de un valor guardado como jsonb en Postgres
const jsz=v=>v==null||typeof v==='boolean'?4:typeof v==='number'?14:typeof v==='string'?new TextEncoder().encode(v).length+8
  :Array.isArray(v)?8+v.reduce((a,x)=>a+jsz(x),0):8+Object.keys(v).reduce((a,k)=>a+k.length+8+jsz(v[k]),0);
// Mete la secuencia en d sin pasarse: quita las entradas más antiguas; si aun así no cabe, menos puntos en la gráfica (d.g).
// 3400 deja hueco para la ficha post-partida (mvp, jp) y margen bajo el límite de 4000 del servidor (si no, rechaza la partida)
function fitD(d,log){const LIM=3400;let l=(Array.isArray(log)?log:[]).slice(-300);
  for(;;){if(l.length)d.l=packLog(l);else delete d.l;if(jsz(d)<=LIM||!l.length)break;l=l.slice(Math.ceil(l.length/5))}
  while(jsz(d)>LIM&&Array.isArray(d.g)&&d.g.length>8)d.g=dsamp(d.g,Math.floor(d.g.length/4));
  return d}
/* Manos estimadas a partir de d.l (heurística de estadística, el marcador no sabe de manos): cada mano acaba con una ráfaga
   de anotaciones; ráfagas separadas por más de 20 s = manos distintas. Los envites no cortan.
   Devuelve {n: manos, pt: puntos anotados, t0: segundo de la primera entrada (>0 si la secuencia se recortó)} o null */
function manos(d){const l=unLog(d);if(!l.length)return null;
  let n=0,pt=0,last=-1e9;
  l.forEach(x=>{if(x[0]==='e')return;if(x[4]-last>20)n++;last=x[4];if(x[0]!=='o')pt+=x[3]});
  return n?{n,pt,t0:l[0][4]}:null}
const tOf=(m,id)=>m.league.a.includes(id)?0:1; // equipo (0/1) de un jugador de la partida en curso
// Progresión del marcador: tras cada cambio se guarda [pa,pb]; a0/b0 = marcador antes (el primero abre la serie y marca la hora de inicio)
const prog=(m,a0,b0)=>{if(!m.sc){if(!m.t0)m.t0=Date.now();m.sc=[a0,b0]}m.sc.push(m.pa,m.pb)};
// Reduce una serie plana [pa,pb,…] a n parejas repartidas por igual, conservando la primera y la última
const dsamp=(g,n)=>{const k=g.length/2;if(k<=n)return g.slice();const r=[];for(let i=0;i<n;i++){const j=Math.round(i*(k-1)/(n-1));r.push(g[2*j],g[2*j+1])}return r};
function winGame(t,o){ // el equipo t gana la partida (o = órdago aceptado: {by,l,pa,pb}); se apunta en la liga
  stopHold();
  const m=S.mus,pa=t?m.pa:m.target,pb=t?m.target:m.pb,e=lances(m),on=m.on;
  if(o){const a0=m.pa,b0=m.pb;m.pa=pa;m.pb=pb;prog(m,a0,b0)} // un órdago acaba sin sumar con los botones: se añade el marcador final a la serie

  if(m.sc)d.g=dsamp(m.sc,120);d.t=m.t0?Math.round((Date.now()-m.t0)/1000):0;
  const ses=m.ses||(m.ses=[0,0]);d.s=[ses[0]+ses[1]+1,ses[0],ses[1]]; // nº de partida en la sesión y marcador de la sesión antes de esta
  if(m.mano)d.mano=m.mano;

    S.league.pending.push({uid:m.recId,date:Date.now(),a:m.league.a,b:m.league.b,na:m.a,nb:m.b,ja:pa,jb:pb,w:t,d});
  }

   Cada móvil elige su color (S.settings.color). De él se toma el tono y la saturación y se generan
   todos los colores (fondo, superficies, acento, equipos) con luminosidades fijas, para que se lea bien
   en modo oscuro y claro elija el color que elija. Sin color elegido se usan los del CSS. */
const COLORS_G=['#94d5a2','#7fb8ff','#b9a2ff','#ff9fc8','#ff9e7a','#f0cf62','#62d3cb','#e57373'];
const COLORS_B=['#0e3b28','#123a5c','#5a1418','#3b2a14','#24323a','#3d1f4d','#1f4a44','#2b2b2b']; // tapetes

const CKEYS=['--bg','--surface','--surface2','--line','--text','--muted','--accent','--on-accent','--a','--a-soft','--b','--b-soft','--ok','--shadow'];
function toHS(hex){
  const n=parseInt(hex.slice(1),16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,l=(mx+mn)/2;
  if(!d)return[0,0];
  const s=d/(1-Math.abs(2*l-1));
  const h=mx===r?((g-b)/d+6)%6:mx===g?(b-r)/d+2:(r-g)/d+4;
  return[Math.round(h*60),Math.round(s*100)];
}

  basePaint(st,hex);
  // retoques uno a uno; los suaves de equipo siguen a su color, y el equipo 1 sigue al acento si no se pintó aparte
  const cu=customOf();
  for(const k in cu)if(/^#[0-9a-f]{6}$/i.test(cu[k]))st.setProperty(k,cu[k]);

  if(cu['--a']||cu['--accent'])st.setProperty('--a-soft','color-mix(in srgb,var(--a) 22%,transparent)');
  if(cu['--b'])st.setProperty('--b-soft','color-mix(in srgb,var(--b) 22%,transparent)');

      '--text':c(h,gray?0:8,88),'--muted':c(h,gray?0:5,56),'--accent':c(h,s,72),'--on-accent':c(h,gray?0:100,12),
      '--b':c(hb,gray?0:Math.round(s*.8),76),'--a-soft':c(h,s,72,.14),'--b-soft':c(hb,gray?0:Math.round(s*.8),76,.14),

// Paleta generada a partir de un solo color (color rápido)
function basePaint(st,hex){

    :{'--bg':c(h,gray?0:40,92),'--surface':'#fff','--surface2':c(h,gray?0:40,86),'--line':c(h,gray?0:45,14),

// Pinta el HTML nuevo tocando solo lo que cambia: los nodos que siguen igual no se recrean,
// así no se repiten las animaciones de entrada (diálogos) ni hay parpadeo al pulsar.
function patch(el,html){
  const t=document.createElement(el.tagName);t.innerHTML=html;
  patchKids(el,t);
}
function patchKids(from,to){
  const a=[...from.childNodes],b=[...to.childNodes];
  b.forEach((n,i)=>{
    const o=a[i];
    if(!o)from.appendChild(n);
    else if(o.nodeType!==n.nodeType||o.nodeName!==n.nodeName)from.replaceChild(n,o);
    else if(o.nodeType===1)patchEl(o,n);
    else if(o.nodeValue!==n.nodeValue)o.nodeValue=n.nodeValue;
  });
  for(let i=b.length;i<a.length;i++)a[i].remove();
}
function patchEl(o,n){
  for(const{name}of[...o.attributes])if(!n.hasAttribute(name))o.removeAttribute(name);
  for(const{name,value}of[...n.attributes])if(o.getAttribute(name)!==value)o.setAttribute(name,value);
  if(o.tagName==='INPUT'&&o!==document.activeElement){const v=n.getAttribute('value')||'';if(o.value!==v)o.value=v}
  patchKids(o,n);
}
function render(){
  const ver=!!verCode(),locked=!S.code&&!ver,v=ver?'ver':locked?'lock':view(),st=S.settings;
  if(st.theme==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=st.theme;

  paint();
  liveSync();
  const html=ver?vVer():locked?vLock():v==='mus'?vMus():v==='settings'?vSettings():v==='liga'?vLiga():v==='partidas'?vMatches():vHome();
  const app=document.getElementById('app');
  app.className=ver?(lv.s?'v-mus ro':'v-home'):'v-'+(['mus','settings','liga','partidas'].includes(v)?v:'home');
  landscape(v==='mus'||(ver&&!!lv.s));
  patch(app,html);
  patch(document.getElementById('modal'),locked||ver?'':vModal());
  document.querySelector('meta[name=theme-color]').content=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  wake();
}

let upChecking=false;
async function checkUpdate(){
  if(BUILD==='dev'||upChecking||!navigator.onLine||modal)return; // con un diálogo abierto se espera a la próxima
  upChecking=true;
  try{
    const html=await (await fetch('./?u='+Date.now(),{cache:'no-store'})).text();
    const m=html.match(/const BUILD='([^']+)'/);
    if(m&&m[1]!==BUILD&&m[1]!=='dev'){toast('Actualizando…');setTimeout(()=>location.reload(),400)}
  }catch(e){}
  upChecking=false;
}
checkUpdate();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
// Versión publicada (navegador y app Android, que la carga de GitHub Pages): funciona sin conexión
// y se actualiza sola. No en el servidor de desarrollo ni en una copia empaquetada (https://localhost).
if('serviceWorker' in navigator&&location.protocol==='https:'&&location.hostname!=='localhost')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
